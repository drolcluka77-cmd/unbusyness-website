<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Unbusyness for Building Managers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop workspace — sidebar nav, sticky top bar, content area with cards; documents open as A4 sheets; same tokens as the phone demo. */
:root{
  --green:#1F4D45; --green-dark:#173D37; --green-soft:#E6EEEB; --on-green:#CFE0DA;
  --apricot:#E8915F; --apricot-light:#F2A57A; --apricot-ink:#A84E22; --apricot-soft:#FBE8DC;
  --slate:#4F5F80; --slate-soft:#E9ECF3;
  --sand:#F4EFE6; --linen:#FBFAF7; --white:#FFFFFF; --side:#FDFCFA;
  --ink:#14201E; --muted:#56615F; --line:#E7E3DA; --line2:#EFEBE3;
  --red:#B23A32; --red-soft:#FBEAE8; --ok:#2F7A55; --ok-soft:#E4F1E8;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:20px;font-weight:700;letter-spacing:-.6px}
.ws{margin:0 4px;background:var(--sand);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.ws .av{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px}
.ws small{display:block;color:var(--muted);font-size:11px}
.navlabel{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#8A938F;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav button:hover{background:var(--sand)}
.nav button.on{background:var(--green-soft);color:var(--green);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
.nav .cnt.hot{background:var(--red);border-color:var(--red);color:#fff}
.sidecard{margin-top:auto;background:var(--sand);border-radius:16px;padding:14px;font-size:12px;color:var(--muted)}
.sidecard b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}

.main{min-width:0}
.top{height:66px;position:sticky;top:0;z-index:10;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink)}
.topr{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.user{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--line);font-size:12px}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--apricot-soft);color:var(--apricot-ink);display:grid;place-items:center;font-weight:700}
.offpill{display:flex;align-items:center;gap:8px;background:var(--slate);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.content{max-width:1360px;margin:0 auto;padding:28px 32px 120px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-1.1px}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--green);color:var(--linen)}
.btn.primary:hover{background:var(--green-dark)}
.btn.apricot{background:var(--apricot);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.line{background:var(--white);border:1px solid var(--line)}
.btn.line:hover{background:var(--sand)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.ch p{margin:2px 0 0;color:var(--muted);font-size:12px}
.cb{padding:16px 20px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}
.stat .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.stat b{font-size:27px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.slate{background:var(--slate-soft);color:var(--slate)} .pill.ink{background:var(--ink);color:var(--linen)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.green{background:var(--green-soft);color:var(--green)} .ic.red{background:var(--red-soft);color:var(--red)} .ic.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .ic.slate{background:var(--slate-soft);color:var(--slate)} .ic.sand{background:var(--sand);color:var(--green)}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--apricot-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:#5A3A26;line-height:1.5}
.explain b{color:var(--apricot-ink)}
.explain .ei{width:22px;height:22px;border-radius:50%;background:var(--white);color:var(--apricot-ink);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:12px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--linen)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* task node tree */
.root{background:var(--green);color:var(--linen);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.root .ri{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--apricot-light);display:grid;place-items:center}
.root small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--on-green);font-weight:700}
.stem{width:1px;height:18px;background:#CFC8BA;margin:0 auto}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--side)}
.bh strong{display:block;font-size:13px}.bh small{display:block;color:var(--muted);font-size:11px}
.task{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line2);width:100%;text-align:left}
.task:hover{background:var(--linen)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--green)}
.dot.red{background:var(--red)}.dot.apricot{background:var(--apricot)}
.task b{display:block;font-size:12.5px;font-weight:700}.task span{display:block;font-size:11.5px;color:var(--muted)}

/* briefing */
.brief{background:var(--green);color:var(--linen);border-radius:20px;padding:18px}
.brief .play{width:48px;height:48px;border-radius:50%;background:var(--apricot);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.brief p{margin:6px 0 0;color:rgba(251,250,247,.45);font-size:13.5px;transition:color .3s}
.brief p.on{color:var(--linen)} .brief p.done{color:var(--on-green)}
.act{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:0}
.act b{display:block;font-size:12.5px}.act span{display:block;font-size:12px;color:var(--muted)}.act time{font-size:11px;color:#8A938F}

/* calls */
.split{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.4fr);gap:16px;align-items:start}
.citem{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.citem:hover{background:var(--linen)}
.citem.sel{background:var(--green-soft)}
.citem b{display:block;font-size:13.5px}.citem span{display:block;font-size:12px;color:var(--muted)}
.summary{background:var(--sand);border-radius:16px;padding:14px 16px;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fld small{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fld b{font-size:13.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:var(--white)}
.mode.on{border-color:var(--green);background:var(--green-soft)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--muted)}

/* week board */
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.col{background:var(--side);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:380px}
.col.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.col .dh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.col .dh b{font-size:13px}.col .dh span{font-size:11px;color:var(--muted)}
.jc{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:8px 10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px}
.jc:hover{box-shadow:0 4px 14px rgba(20,32,30,.08)}
.jc b{font-size:12.5px;line-height:1.3}.jc span{font-size:11px;color:var(--muted)}
.jc .t{font-size:11px;font-weight:800;color:var(--ink)}
.jc.done{opacity:.62}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--green)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,32,30,.38);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:32px 16px;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(480px,100%);height:100%;background:var(--linen);overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px)}to{transform:none}}
.modal{width:min(880px,100%);background:var(--linen);border-radius:24px;padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mh h2{margin:0;font-size:20px;letter-spacing:-.5px}
.x{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center}

/* translator */
.langbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:var(--linen);border-radius:16px;padding:12px 16px}
.langbar small{display:block;color:var(--on-green);font-size:11px;font-weight:700}
.langbar b{font-size:15px}
.convo{display:flex;flex-direction:column;gap:8px}
.bub{border-radius:16px;padding:10px 14px;max-width:80%;display:flex;flex-direction:column;gap:2px}
.bub.w{align-self:flex-end;background:var(--green-soft)} .bub.c{align-self:flex-start;background:var(--white);border:1px solid var(--line)}
.bub .l{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bub .o{font-size:13px;color:var(--muted)} .bub .big{font-size:17px;font-weight:700} .bub .gl{font-size:12px;color:#7A8481;font-style:italic}
.phr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phr button{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.phr button:hover{background:var(--sand)}

/* documents: A4 sheet */
.tabs{display:flex;gap:4px;background:var(--sand);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--white);color:var(--green)}
.docwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 40px rgba(20,32,30,.10);padding:44px 48px;color:#1b2422;font-size:12.5px;aspect-ratio:210/297;max-width:100%;display:flex;flex-direction:column}
.sheet .sh{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.sheet .co b{font-size:15px}
.sheet .co div,.sheet .meta div{color:#4b5653;font-size:11.5px;line-height:1.55}
.sheet h3{margin:28px 0 4px;font-size:24px;letter-spacing:-.6px;font-weight:700}
.sheet .meta{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:11.5px;text-align:right}
.sheet .meta span{color:#7b8582}
.sheet .bill{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:18px 0 22px}
.sheet .bill small{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:#7b8582;text-transform:uppercase;margin-bottom:4px}
.sheet table{width:100%;border-collapse:collapse;font-size:11.5px}
.sheet th{background:var(--sand);text-align:left;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;color:#4b5653}
.sheet td{padding:9px 10px;border-bottom:1px solid #eee9df}
.sheet .r{text-align:right;font-variant-numeric:tabular-nums}
.sheet .tot{margin-left:auto;width:270px;margin-top:14px;font-size:12px}
.sheet .tot div{display:flex;justify-content:space-between;padding:5px 10px}
.sheet .tot .grand{background:var(--green);color:#fff;border-radius:6px;font-weight:800;font-size:14px;padding:9px 10px;margin-top:4px}
.sheet .pay{margin-top:auto;display:grid;grid-template-columns:1fr 92px;gap:16px;border-top:1px solid #eee9df;padding-top:14px;font-size:11px;color:#4b5653}
.qr{width:92px;height:92px;border-radius:6px;background:conic-gradient(#1b2422 25%,#fff 0 50%,#1b2422 0 75%,#fff 0) 0 0/16px 16px;border:6px solid #fff;outline:1px solid #ddd}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:2px;transform:rotate(-6deg);font-size:14px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;position:relative}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl.on i{background:var(--green)}
.tl b{display:block;font-size:12.5px}.tl span{font-size:11.5px;color:var(--muted)}
.integ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.integ .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.bars .br{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bars .bar{height:12px;border-radius:6px;background:var(--sand);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:6px}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.switch{width:50px;height:30px;border-radius:15px;background:#CFC8BA;position:relative;flex-shrink:0;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]:after{transform:translateX(20px)}

/* voice */
.fab{position:fixed;right:28px;bottom:28px;z-index:30;width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--linen);display:grid;place-items:center;box-shadow:0 12px 30px rgba(31,77,69,.38)}
.fab:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--apricot-light);animation:ring 2.6s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.15);opacity:0}}
.voice{width:min(560px,100%);background:var(--green);color:var(--linen);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;margin-top:60px}
.orb{width:110px;height:110px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 50% 45%,var(--apricot-light),var(--apricot) 60%);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 14px rgba(242,165,122,.16)}
.orb.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 24px rgba(242,165,122,.2)}}
.said{font-size:19px;font-weight:600;text-align:center;min-height:56px}
.ex button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-top:6px;font-weight:600}
.plan{background:var(--linen);color:var(--ink);border-radius:16px;padding:12px 16px}
.plan .pr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.plan .pr:last-of-type{border-bottom:0}

.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{border:1.5px solid var(--line);background:var(--white);border-radius:12px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;color:var(--ink)}
.who button b{font-size:13.5px}.who button span{font-size:11.5px;color:var(--muted)}
.who button.on{border-color:var(--green);background:var(--green-soft);box-shadow:inset 0 0 0 1px var(--green)}
.plan .who{grid-template-columns:repeat(4,1fr);margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;display:grid;place-items:center;border:0;width:100%}
.thumb.job{background:linear-gradient(135deg,#C9D9D3,#8FB0A6);color:#fff}.thumb.inv{background:#fff;border:1px solid var(--line);color:var(--apricot-ink)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .lbl{position:absolute;left:5px;right:5px;bottom:5px;border-radius:6px;font-size:10px;font-weight:800;text-align:center;padding:1px 4px;background:var(--green);color:#fff}
.thumb.inv .lbl{background:var(--apricot);color:var(--ink)}
.thumb.flag{outline:3px solid var(--red);outline-offset:-3px}
.thumb .warn{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.lblpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lblpick button{border:2px solid var(--line);background:var(--white);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:var(--ink)}
.lblpick button b{font-size:15px;display:flex;gap:8px;align-items:center}.lblpick button span{font-size:12.5px;color:var(--muted)}
.lblpick button.on{border-color:var(--green);background:var(--green-soft)}
.btn.off{opacity:.4;pointer-events:none}
.flagbox{display:flex;gap:10px;align-items:flex-start;background:var(--red-soft);color:#6d2420;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.flagbox .ei{width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:12px}
.flagbox b{color:var(--red)}
.okbox{display:flex;gap:10px;align-items:flex-start;background:var(--ok-soft);color:#1f4a35;border-radius:14px;padding:12px 14px;font-size:13px}
.receipt{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;box-shadow:0 8px 24px rgba(20,32,30,.10);transform:rotate(-1.2deg);color:#28302e}
.receipt .rr{display:flex;justify-content:space-between;gap:10px}
.receipt hr{border:0;border-top:1px dashed #bbb;margin:8px 0}
.receipt.blur{filter:blur(1.1px)}
.wrongpic{aspect-ratio:4/3;border-radius:12px;background:radial-gradient(circle at 40% 45%,#7a8f88 0 18%,#5c716a 19% 24%,transparent 25%),linear-gradient(135deg,#9DB8AF,#4E6E64);display:grid;place-items:end start;color:#fff;padding:12px;font-size:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--linen);border-radius:14px;padding:12px 16px;font-weight:600;font-size:13px;z-index:60;display:flex;gap:8px;align-items:center;max-width:min(560px,calc(100% - 32px))}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.gmain,.split,.docwrap{grid-template-columns:1fr}.integ{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* building-manager additions */
.need{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line2)}
.need:last-child{border-bottom:0}
.need .grow{min-width:0;flex:1}
.need b{display:block;font-size:13.5px}.need span:not(.ic){display:block;font-size:12px;color:var(--muted)}
.grow{flex:1;min-width:0}
.citem .ic,.need .ic{display:grid}
.statb{text-align:left;width:100%}
.statb:hover{border-color:var(--green)}
.bcard{text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column}
.bcard:hover{box-shadow:0 8px 24px rgba(20,32,30,.08)}
.bimg{height:86px;display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px;color:#fff;background-image:linear-gradient(135deg,rgba(255,255,255,.12),rgba(0,0,0,.1))}
.bimg span{font-size:12px;font-weight:800;background:rgba(0,0,0,.18);border-radius:99px;padding:2px 10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px}.kv span{color:var(--muted)}.kv b{text-align:right}
.sel{min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--white);padding:0 12px;font-weight:600}
.ta{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--white);resize:vertical;line-height:1.5}
.votebar{position:relative;height:22px;border-radius:11px;background:var(--sand);display:flex;overflow:visible}
.votebar i{display:block;height:100%}.votebar .y{background:var(--ok);border-radius:11px 0 0 11px}.votebar .n{background:var(--red)}
.votebar .thr{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);padding:0;border:0}
.livedot{width:12px;height:12px;border-radius:50%;background:var(--apricot-light);animation:pulse 1.2s infinite}
.sheet p{margin:8px 0 0;line-height:1.6}
.who button.on b{color:var(--green)}
@media (max-width:760px){.need{flex-wrap:wrap}.need .btn{margin-left:50px}}

@media (max-width:760px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:8px;padding:12px 16px}.side .ws,.side .navlabel,.sidecard{display:none}.nav{flex-direction:row;flex-wrap:wrap}.nav button{width:auto;padding:8px 10px}.top{padding:0 16px}.content{padding:20px 16px 110px}.g3,.g2,.branches,.fields,.modes,.phr,.integ{grid-template-columns:1fr}.sheet{padding:24px;aspect-ratio:auto}.user span{display:none}}

function simCall(){const steps=[
  ['ai','Unbusyness, building management. How can I help?'],['r','At Fužine 21, there’s a strong smell of gas in the basement of entrance A!'],
  ['ai','This is urgent. Please don’t switch on any lights or use lighters. Open the windows, leave the basement and wait outside. I’m alerting the gas emergency service and your building manager now.'],['r','OK, I’m going outside.'],
  ['ai','Thank you. I’ve alerted the gas service, arriving in 20 minutes. I’m texting everyone in entrance A not to use open flames.']];
  S.newCall={i:0,steps};drawSim();const tick=()=>{if(!S.newCall)return;if(S.newCall.i<steps.length){S.newCall.i++;drawSim();setTimeout(tick,1600)}};setTimeout(tick,700)}
function drawSim(){const c=S.newCall;if(!c)return;const done=c.i>=c.steps.length;
  layer(`<div class="scrim center" onclick="if(event.target===this)endSim()"><div class="modal" role="dialog" aria-label="Resident’s call" style="width:min(620px,100%)"><div class="mh"><h2>${svg('phone',18)} Incoming call · 041 555 302</h2><button class="x" onclick="endSim()" aria-label="Close">${svg('x')}</button></div>
  <div class="langbar"><div><small>UNBUSYNESS IS ANSWERING</small><b>${done?'Call ended · report created':'Call in progress …'}</b></div>${done?pill('Nujno: plin','red'):'<span class="livedot" aria-hidden="true"></span>'}</div>
  <div class="convo">${c.steps.slice(0,c.i).map(([w,t])=>`<div class="bub ${w==='ai'?'w':'c'}"><span class="l">${w==='ai'?'Unbusyness':'Resident'}</span><span>${esc(t)}</span></div>`).join('')}</div>
  ${done?`<div class="okbox">${svg('check',18)}<div><b>Report #2487 created</b> · Pot na Fužine 21, entrance A, basement. The gas service has been notified, you by phone and 32 apartments in entrance A by text.</div></div><div class="btns"><button class="btn primary" onclick="addGas()">Open the report</button></div>`:''}</div></div>`)}
function endSim(){if(S.newCall&&S.newCall.i>=S.newCall.steps.length)addGas(true);S.newCall=null;closeLayer()}
function addGas(stay){if(!R.find(r=>r.id===2487))R.unshift({id:2487,b:'fuz',where:'entrance A · basement',who:'Tomaž Kos',ph:'041 555 302',ch:'Call',t:'now',day:'Today',cat:'Gas',urg:'urgent',st:2,con:'pln',title:'Smell of gas in the basement',
  sum:'A resident smells strong gas in the basement of entrance A. He got safety instructions, the gas service is on the way. Everyone in entrance A has been texted.',
  talk:S.newCall?S.newCall.steps:[],log:[['now','Call answered by Unbusyness','Urgent: gas. Safety instructions given.'],['now','Gas emergency service notified','Arriving in 20 minutes.'],['now','Call to the building manager','Maja Kovač notified by phone.'],['now','Text to entrance A','32 apartments: do not use open flames.']],photos:0,cost:null});
  S.newCall=null;if(stay===true){render();toast('New urgent report #2487 is in the reports.');return}S.filter='open';openReport(2487)}

/* ---------- Stavbe ---------- */
function pBuildings(){const bs=Object.values(BLD);
  return head('Buildings',`${bs.length} buildings managed`,`${bs.reduce((a,b)=>a+b.units,0)} apartments · ${bs.reduce((a,b)=>a+b.owners,0)} apartment owners`)+
  `<div class="grid g3">${bs.map(b=>{const open=R.filter(r=>r.b===b.id&&r.st<3),next=DUT.filter(d=>d.b===b.id).sort((x,y)=>x.next.localeCompare(y.next))[0];
    return `<button class="card bcard" onclick="openBuilding('${b.id}')"><div class="bimg" style="background:${b.color}">${svg('build',30,1.6)}<span>${b.units} apts</span></div><div class="cb" style="display:grid;gap:8px"><div><b style="font-size:16px">${esc(b.name)}</b><div class="muted" style="font-size:12px">${esc(b.city)} · ${esc(b.entr)} · built ${b.year}${b.lift?' · lift':''}</div></div>
    <div class="kv"><span>Reserve fund</span><b>${eur(b.fund)}</b></div><div class="kv"><span>Open reports</span><b>${open.length?`<span style="color:${open.some(r=>r.urg==='urgent')?'var(--red)':'inherit'}">${open.length}</span>`:'0'}</b></div><div class="kv"><span>Next deadline</span><b>${next?esc(next.what.replace(/^Redni p/,'P'))+' · '+fdate(next.next):'—'}</b></div></div></button>`}).join('')}</div>`}
function openBuilding(id){const b=BLD[id],open=R.filter(r=>r.b===id),du=DUT.filter(d=>d.b===id);
  layer(`<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="drawer" role="dialog" aria-label="${esc(b.name)}"><div class="mh"><div><div class="eyebrow">Building</div><h2>${esc(b.name)}</h2></div><button class="x" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  <div class="fields"><div class="fld"><small>Apartments</small><b>${b.units}</b></div><div class="fld"><small>Owners</small><b>${b.owners}</b></div><div class="fld"><small>Built</small><b>${b.year}</b></div></div>
  <div class="card cb" style="display:grid;gap:6px"><div class="kv"><span>Reserve fund</span><b>${eur(b.fund)}</b></div><div class="kv"><span>Contribution</span><b>${b.fundMonth.toFixed(2)} €/m² per month</b></div><div class="kv"><span>Next meeting</span><b>${id==='voj'?'20 Nov 2026':'not called yet'}</b></div></div>
  <b>Reports</b><div class="card">${open.length?open.map(r=>`<button class="citem" onclick="openReport(${r.id})"><span class="ic sand">${svg(CATIC[r.cat]||'alert')}</span><div class="grow"><b>${esc(r.title)}</b><span>${esc(r.t)}</span></div>${stPill(r)}</button>`).join(''):'<div class="cb muted">No reports.</div>'}</div>
  <b>Deadlines</b><div class="card">${du.map(d=>`<div class="citem"><span class="ic sand">${svg('cal')}</span><div class="grow"><b>${esc(d.what)}</b><span>${esc(d.every)} · ${fdate(d.next)}</span></div>${pill(DST[d.st][0],DST[d.st][1])}</div>`).join('')||'<div class="cb muted">No deadlines entered.</div>'}</div>
  <b>Documents</b><div class="card">${['Building management contract','House rules','Energetska izkaznica','Zapisnik zbora lastnikov 2025','Maintenance plan 2026–2027'].map(d=>`<button class="citem" onclick="toast('${d}: opened (example)')"><span class="ic sand">${svg('doc')}</span><div class="grow"><b>${d}</b><span>PDF</span></div></button>`).join('')}</div>
  </div></div>`)}

/* ---------- Vzdrževanje ---------- */
function pMaint(){const list=DUT.filter(d=>S.bfilter==='all'||d.b===S.bfilter).sort((a,b)=>a.next.localeCompare(b.next));
  return head('Maintenance','Deadlines and regular tasks','Unbusyness books the contractor in time and tells residents the date.',`<select class="sel" aria-label="Building" onchange="S.bfilter=this.value;render()"><option value="all">All buildings</option>${Object.values(BLD).map(b=>`<option value="${b.id}" ${S.bfilter===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`)+
  `<div class="card tscroll"><table class="tbl"><thead><tr><th>Building</th><th>Task</th><th>Every</th><th>Next deadline</th><th>Contractor</th><th>Status</th><th></th></tr></thead><tbody>${list.map(d=>{const dd=daysTo(d.next);
    return `<tr><td><b>${esc(BLD[d.b].name)}</b></td><td>${esc(d.what)}</td><td class="muted">${esc(d.every)}</td><td><b>${fdate(d.next)}</b><div class="muted" style="font-size:11.5px">${dd<0?'overdue':dd===0?'today':'in '+dd+' days'}</div></td><td class="muted">${d.con?esc(CON[d.con].name):'—'}</td><td>${pill(DST[d.st][0],DST[d.st][1])}</td><td class="num">${d.st==='late'||d.st==='soon'?`<button class="btn primary sm" onclick="bookDuty('${d.id}')">Book</button>`:''}</td></tr>`}).join('')}</tbody></table></div>
  <p class="muted" style="font-size:12px;margin-top:10px">These deadlines are examples. We set the intervals for each building from your contracts and the regulations.</p>`}
function bookDuty(id){const d=DUT.find(x=>x.id===id);d.st='booked';d.con=d.con||(/gasil|hidrant/.test(d.what)?'gsl':'ele');render();toast(`${d.what} (${BLD[d.b].name}) booked. Residents will be told 3 days before.`)}

/* ---------- Izvajalci ---------- */
function pContractors(){return head('Contractors','Your contractors','Unbusyness sends each report to the right contractor for that building. Contractors on call also get urgent reports at night.')+
  `<div class="card tscroll"><table class="tbl"><thead><tr><th>Contractor</th><th>Trade</th><th>Phone</th><th>Average response</th><th class="num">Open jobs</th><th>On call</th></tr></thead><tbody>${Object.values(CON).map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="muted">${esc(c.trade)}</td><td>${esc(c.phone)}</td><td>${esc(c.resp)}</td><td class="num">${R.filter(r=>r.con===c.id&&r.st<3).length}</td><td><button class="switch" role="switch" aria-checked="${c.on}" aria-label="On call: ${esc(c.name)}" onclick="CON['${c.id}'].on=!CON['${c.id}'].on;render();toast(CON['${c.id}'].on?'${esc(c.name)} gets urgent reports at night.':'${esc(c.name)} no longer gets urgent reports at night.')"></button></td></tr>`).join('')}</tbody></table></div>`}

/* ---------- Zbori ---------- */
function pMeetings(){const m=MEET,b=BLD[m.b],v=m.vote;
  return head('Owners’ meetings','Meeting of apartment owners · '+esc(b.name),esc(m.date)+' · '+esc(m.place),`<div class="btns"><button class="btn line" onclick="openInvite()">${svg('doc',16)}Invitation</button><button class="btn primary" onclick="openInvite()">${svg('send',16)}${S.sent?'Invitations sent':'Send invitations'}</button></div>`)+
  `<div class="grid gmain"><div class="grid" style="gap:16px"><div class="card"><div class="ch"><h2>Agenda</h2>${S.sent?pill('Vabila poslana 46 lastnikom','ok'):pill('Invitations not sent yet','apricot')}</div><div class="cb">${m.agenda.map((a,i)=>`<div class="act"><b style="width:22px">${i+1}.</b><div>${esc(a)}</div></div>`).join('')}</div></div>
    <div class="card"><div class="ch"><div><h2>Written vote pred zborom</h2><p>${esc(v.item)}</p></div>${pill(v.yes>v.need?'Decision passed':'Voting in progress',v.yes>v.need?'ok':'apricot')}</div><div class="cb" style="display:grid;gap:10px">
      <div class="votebar" role="img" aria-label="${String(v.yes)} % of ownership shares for, ${String(v.no)} % against"><i class="y" style="width:${v.yes}%"></i><i class="n" style="width:${v.no}%"></i><span class="thr" style="left:${v.need}%"></span></div>
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;font-size:13px"><span><b style="color:var(--ok)">${String(v.yes)} % FOR</b> · <b style="color:var(--red)">${String(v.no)} % AGAINST</b> · ${v.ofOwners} of ${b.owners} owners voted</span><span class="muted">Needed: more than half of the ownership shares (regular management decision)</span></div>
      <div class="okbox">${svg('check',18)}<div>Majority reached. Unbusyness will prepare the order with Elektro Medved and record the decision in the meeting minutes.</div></div></div></div>
  </div><aside class="grid" style="gap:16px"><div class="card cb" style="display:grid;gap:8px"><b>What Unbusyness handles</b>${['Invitation with the agenda to all owners (email, post, notice board)','A reminder 2 days before the meeting','A written vote for those who can’t attend','Minutes and decisions, saved with the building','Orders to contractors after the decisions are passed'].map(x=>`<div class="row" style="gap:8px;align-items:flex-start"><span style="color:var(--green)">${svg('check',16)}</span><span>${x}</span></div>`).join('')}</div>
  <div class="card cb" style="display:grid;gap:6px"><div class="kv"><span>Reserve fund</span><b>${eur(b.fund)}</b></div><div class="kv"><span>LED quote</span><b>${eur(4860)}</b></div><div class="kv"><span>After the work</span><b>${eur(b.fund-4860)}</b></div></div></aside></div>`}
function openInvite(){const m=MEET,b=BLD[m.b];
  layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-label="Meeting invitation" style="width:min(760px,100%)"><div class="mh"><h2>Invitation to the meeting of apartment owners</h2><button class="x" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  <div class="sheet"><div class="sh"><div class="co"><b>${CO.name}</b><div>Building manager ${esc(b.name)}</div><div>Ljubljana</div></div><div class="meta"><span>Date</span><b>6 Nov 2026</b><span>No.</span><b>VOJ-ZB-2026-02</b></div></div>
  <h3>Invitation to the meeting of apartment owners</h3><p>Dear owners of ${esc(b.name)},</p><p>we invite you to the meeting of apartment owners, on <b>${esc(m.date)}</b>, ${esc(m.place)}.</p>
  <p style="margin-top:14px"><b>Proposed agenda:</b></p><ol style="margin:4px 0 0 18px;padding:0">${m.agenda.map(a=>`<li>${esc(a)}</li>`).join('')}</ol>
  <p style="margin-top:14px">Documents for items 2 and 3 are attached. Owners who can’t attend can vote in writing through the link in the email or on the enclosed ballot.</p>
  <p style="margin-top:auto">Kind regards,<br>${CO.manager}, ${CO.name}</p></div>
  <div class="btns"><button class="btn primary" onclick="sendInvites()">${svg('send',16)}Send to 46 owners</button><button class="btn line" onclick="closeLayer()">Close</button></div></div></div>`)}
function sendInvites(){S.sent=true;closeLayer();render();toast('Invitations sent: 39 by email, 7 by post. A PDF for the notice board is ready.')}

/* ---------- Stroški ---------- */
function pCosts(){const bs=Object.values(BLD);const month={voj:2840,cel:3410,tru:690,ker:1220,fuz:5180,zal:1760};const max=Math.max(...Object.values(month));
  return head('Costs and funds','Costs by building','Contractor invoices land with the right building and report. Unbusyness also reads invoices from a PDF or a photo.')+
  `<div class="grid g2" style="align-items:start"><div class="card"><div class="ch"><div><h2>Invoices to approve</h2><p>Read by Unbusyness, split by the building’s rules</p></div></div>${INV.map(i=>`<div class="need"><span class="ic ${i.st==='ok'?'green':'slate'}">${svg('receipt')}</span><div class="grow"><b>${esc(CON[i.con].name)} · ${eur2(i.amt)}</b><span>${esc(BLD[i.b].name)} · ${esc(i.what)} · ${esc(i.no)}</span><span>Paid by: ${esc(i.split)}</span></div>${i.st==='ok'?pill('Potrjeno','ok'):`<button class="btn primary sm" onclick="approveInv('${i.id}')">Approve</button>`}</div>`).join('')}</div>
  <div class="card"><div class="ch"><div><h2>Costs in October</h2><p>Maintenance and running costs, excluding energy</p></div></div><div class="cb bars">${bs.map(b=>`<div class="br"><span>${esc(b.name)}</span><span class="bar"><i style="width:${month[b.id]/max*100}%;background:${b.color}"></i></span><b>${eur(month[b.id])}</b></div>`).join('')}</div></div></div>
  <div class="card tscroll" style="margin-top:16px"><div class="ch"><div><h2>Reserve funds</h2><p>Balance on 31 Oct 2026</p></div></div><table class="tbl"><thead><tr><th>Building</th><th class="num">Status</th><th class="num">Contribution</th><th class="num">Per apartment</th><th>Planned</th></tr></thead><tbody>${bs.map(b=>`<tr><td><b>${esc(b.name)}</b></td><td class="num"><b>${eur(b.fund)}</b></td><td class="num">${b.fundMonth.toFixed(2)} €/m²</td><td class="num">${eur(b.fund/b.units)}</td><td class="muted">${{voj:'LED lighting (€4,860)',cel:'Lift renovation 2028',tru:'Basement damp repair',ker:'—',fuz:'Facade entrance C 2027',zal:'Intercom'}[b.id]}</td></tr>`).join('')}</tbody></table></div>`}
function approveInv(id){const i=INV.find(x=>x.id===id);i.st='ok';render();toast(`Invoice ${i.no} potrjen. ${i.split==='Owner of apt. 11'?'Owner of apt. 11 gets the invoice with an explanation.':'Added to the building’s costs.'}`)}

/* ---------- voice ---------- */
const VOICE=[
 {say:'Send the electrician to Fužine 21, entrance C, about the light.',plan:[['Report','#2485 · stairwell light'],['Contractor','Elektro Medved'],['Notice','SMS Jani Hribar']],done:()=>{if(rep(2485).st===0)sendTo(2485,'ele');else toast('Already sent to Elektro Medved.')}},
 {say:'Tell everyone at Celovška 88 that the lift works again.',plan:[['Building','Celovška 88 · 64 apartments'],['Channels','SMS in oglasna deska'],['Report','#2484 I’ll mark as resolved']],done:()=>{const r=rep(2484);if(r.st<3)r.st=3;render();toast('Sent to 64 apartments: the lift is working again.')}},
 {say:'When is the next lift inspection at Vojkova?',plan:[['Answer','18 Nov 2026, Lift-Servis d.o.o.'],['Status','Contractor booked']],done:()=>toast('Next lift inspection at Vojkova 12: 18 Nov 2026.')},
];
function openVoice(){S.v={i:-1,live:false};drawVoice()}
function drawVoice(){const v=S.v,c=v.i>=0?VOICE[v.i]:null;
  layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="voice" role="dialog" aria-label="Voice command"><div class="mh"><b>Voice command</b><button class="x" style="background:rgba(255,255,255,.14);border:0;color:var(--linen)" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  <div class="orb ${v.live?'live':''}">${svg('mic',40)}</div><div class="said">${c?'»'+esc(c.say)+'«':'Tell me what to do. For example:'}</div>
  ${c&&!v.live?`<div class="plan">${c.plan.map(([a,b])=>`<div class="pr"><span class="muted">${a}</span><b>${esc(b)}</b></div>`).join('')}<div class="btns" style="margin-top:10px"><button class="btn primary" onclick="const f=VOICE[${v.i}].done;closeLayer();f()">${svg('check',16)}Approve</button><button class="btn line" onclick="S.v={i:-1};drawVoice()">Another command</button></div></div>`:''}
  ${!c?`<div class="ex">${VOICE.map((x,i)=>`<button onclick="sayV(${i})">»${esc(x.say)}«</button>`).join('')}</div>`:''}</div></div>`)}
function sayV(i){S.v={i,live:true};drawVoice();setTimeout(()=>{if(S.v&&S.v.i===i){S.v.live=false;drawVoice()}},1300)}

document.getElementById('fab').onclick=openVoice;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
render();

</script>
