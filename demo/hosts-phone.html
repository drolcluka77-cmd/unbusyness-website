/* Unbusyness for Hosts, phone demo. Same device frame as the other demos; all data is made up. */
:root{
  --green:#1F4D45; --green-dark:#173D37; --green-soft:#E6EEEB; --on-green:#CFE0DA;
  --apricot:#E8915F; --apricot-light:#F2A57A; --apricot-ink:#A84E22; --apricot-soft:#FBE8DC;
  --slate:#4F5F80; --slate-soft:#E9ECF3;
  --sand:#F4EFE6; --linen:#FBFAF7; --white:#FFFFFF;
  --ink:#14201E; --muted:#56615F; --line:#E7E3DA;
  --red:#B23A32; --red-soft:#FBEAE8; --ok:#2F7A55; --ok-soft:#E4F1E8;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{max-width:330px;display:flex;flex-direction:column;gap:16px}
.side h1{margin:0;font-size:40px;line-height:1.05;letter-spacing:-1.5px;font-weight:700;text-wrap:balance}
.side h1 span{color:var(--green)}
.side p{margin:0;color:var(--muted);font-size:16px}
.side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px}
.side li{display:flex;gap:10px;align-items:flex-start}
.side li:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--apricot);margin-top:8px;flex-shrink:0}
.brandrow{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.5px}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 64px);border-radius:48px;background:var(--linen);box-shadow:0 0 0 10px #14201E,0 30px 80px rgba(20,32,30,.28);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:820px){.side{display:none}.stage{padding:0;gap:0;align-items:stretch}.phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;box-shadow:none}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 18px 6px;background:var(--linen);min-height:76px}
@media (max-width:820px){.topbar{padding-top:calc(14px + env(safe-area-inset-top,0px))}}
.hello small{display:block;font-size:13px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.hello strong{font-size:26px;font-weight:700;letter-spacing:-.8px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--apricot-soft);color:var(--apricot-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.back{display:flex;align-items:center;gap:6px;min-height:48px;padding:0 14px 0 8px;margin-left:-8px;border-radius:99px;font-weight:700;font-size:16px;color:var(--green)}
.title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 18px 120px}

.tabs{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;justify-content:center;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:14px;position:relative}
.tab.on{color:var(--green)}
.tab.on:after{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--green)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;display:flex;justify-content:space-between;align-items:center}
.night{background:var(--green);color:var(--linen);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:12px}
.night small{font-size:13px;font-weight:700;color:var(--on-green);letter-spacing:.4px;text-transform:uppercase}
.night h2{margin:0;font-size:23px;letter-spacing:-.6px;line-height:1.2}
.night p{margin:0;color:var(--on-green);font-size:15.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px}
.stats b{display:block;font-size:22px;letter-spacing:-.5px}
.stats span{font-size:12px;color:var(--on-green)}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card+.card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.green{background:var(--green-soft);color:var(--green)}.ic.red{background:var(--red-soft);color:var(--red)}.ic.apricot{background:var(--apricot-soft);color:var(--apricot-ink)}.ic.slate{background:var(--slate-soft);color:var(--slate)}
.main{flex:1;min-width:0}
.main strong{display:block;font-size:16.5px;font-weight:700;line-height:1.3}
.main span{display:block;font-size:14.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}.tag.green{background:var(--green-soft);color:var(--green)}.tag.apricot{background:var(--apricot-soft);color:var(--apricot-ink)}.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.slate{background:var(--slate-soft);color:var(--slate)}
.btn{min-height:52px;border-radius:16px;padding:0 16px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:var(--linen)}
.btn.apricot{background:var(--apricot);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.line{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:2px 14px}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;min-height:72px}
.item:last-child{border-bottom:0}
.chev{color:#8A938F;flex-shrink:0}
.time{font-weight:800;font-size:15px;min-width:48px}

.chat{display:flex;flex-direction:column;gap:8px;background:var(--sand);border-radius:22px;padding:14px}
.msg{max-width:86%;border-radius:16px;padding:9px 12px;font-size:15px;line-height:1.45;background:var(--white);border:1px solid var(--line)}
.msg.g{align-self:flex-start}
.msg.ai{align-self:flex-end;background:var(--green-soft);border-color:transparent}
.msg.you{align-self:flex-end;background:var(--green);color:var(--linen);border-color:transparent}
.msg small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.msg.you small{color:var(--on-green)}
.sys{align-self:center;font-size:12.5px;font-weight:700;color:var(--apricot-ink);background:var(--apricot-soft);border-radius:99px;padding:5px 12px;text-align:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:48px 16px 1fr;gap:10px;padding:8px 0;position:relative}
.steps time{font-weight:800;font-size:13.5px;color:var(--muted)}
.steps i{width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:5px}
.steps li.todo i{background:var(--white);border:2px solid var(--line)}
.steps b{display:block;font-size:15px}.steps span{font-size:13.5px;color:var(--muted)}
.big{font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--green)}
.bar{height:10px;border-radius:5px;background:var(--sand);overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:5px}
.q{background:var(--sand);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.q em{font-style:normal;font-size:14.5px}
.q .res{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:10px 4px 0}

.guest{position:absolute;inset:0;background:var(--linen);z-index:20;display:flex;flex-direction:column;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.guest .gh{background:var(--green);color:var(--linen);padding:22px 18px 18px;display:flex;flex-direction:column;gap:6px}
@media (max-width:820px){.guest .gh{padding-top:calc(18px + env(safe-area-inset-top,0px))}}
.guest .gh small{color:var(--on-green);font-weight:700;font-size:12.5px;letter-spacing:1px;text-transform:uppercase}
.guest .gh h2{margin:0;font-size:24px;letter-spacing:-.5px}
.guest .gb{flex:1;overflow:auto;padding:16px 18px 110px;display:flex;flex-direction:column;gap:10px}
.gtile{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gtile button{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.gtile b{font-size:15px}.gtile span{font-size:13px;color:var(--muted)}
.offer{background:var(--apricot-soft);border:1px solid var(--apricot);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.offer b{font-size:16px}
.gclose{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:20px}
@media (max-width:820px){.gclose{top:calc(12px + env(safe-area-inset-top,0px))}}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:var(--ink);color:var(--linen);border-radius:16px;padding:14px 16px;font-size:15px;font-weight:600;z-index:30;animation:up .2s ease-out}
