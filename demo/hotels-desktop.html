<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Unbusyness za hotele</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop workspace — sidebar nav, sticky top bar, content area with cards; documents open as A4 sheets; same tokens as the phone demo. */
:root{
  --green:#1F4D45; --green-dark:#173D37; --green-soft:#E6EEEB; --on-green:#CFE0DA;
  --apricot:#E8915F; --apricot-light:#F2A57A; --apricot-ink:#A84E22; --apricot-soft:#FBE8DC;
  --slate:#4F5F80; --slate-soft:#E9ECF3;
  --sand:#F4EFE6; --linen:#FBFAF7; --white:#FFFFFF; --side:#FDFCFA;
  --ink:#14201E; --muted:#56615F; --line:#E7E3DA; --line2:#EFEBE3;
  --red:#B23A32; --red-soft:#FBEAE8; --ok:#2F7A55; --ok-soft:#E4F1E8;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:20px;font-weight:700;letter-spacing:-.6px}
.ws{margin:0 4px;background:var(--sand);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.ws .av{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px}
.ws small{display:block;color:var(--muted);font-size:11px}
.navlabel{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#8A938F;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav button:hover{background:var(--sand)}
.nav button.on{background:var(--green-soft);color:var(--green);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
.nav .cnt.hot{background:var(--red);border-color:var(--red);color:#fff}
.sidecard{margin-top:auto;background:var(--sand);border-radius:16px;padding:14px;font-size:12px;color:var(--muted)}
.sidecard b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}

.main{min-width:0}
.top{height:66px;position:sticky;top:0;z-index:10;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink)}
.topr{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.user{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--line);font-size:12px}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--apricot-soft);color:var(--apricot-ink);display:grid;place-items:center;font-weight:700}
.offpill{display:flex;align-items:center;gap:8px;background:var(--slate);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.content{max-width:1360px;margin:0 auto;padding:28px 32px 120px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-1.1px}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--green);color:var(--linen)}
.btn.primary:hover{background:var(--green-dark)}
.btn.apricot{background:var(--apricot);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.line{background:var(--white);border:1px solid var(--line)}
.btn.line:hover{background:var(--sand)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.ch p{margin:2px 0 0;color:var(--muted);font-size:12px}
.cb{padding:16px 20px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}
.stat .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.stat b{font-size:27px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.slate{background:var(--slate-soft);color:var(--slate)} .pill.ink{background:var(--ink);color:var(--linen)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.green{background:var(--green-soft);color:var(--green)} .ic.red{background:var(--red-soft);color:var(--red)} .ic.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .ic.slate{background:var(--slate-soft);color:var(--slate)} .ic.sand{background:var(--sand);color:var(--green)}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--apricot-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:#5A3A26;line-height:1.5}
.explain b{color:var(--apricot-ink)}
.explain .ei{width:22px;height:22px;border-radius:50%;background:var(--white);color:var(--apricot-ink);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:12px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--linen)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* task node tree */
.root{background:var(--green);color:var(--linen);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.root .ri{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--apricot-light);display:grid;place-items:center}
.root small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--on-green);font-weight:700}
.stem{width:1px;height:18px;background:#CFC8BA;margin:0 auto}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--side)}
.bh strong{display:block;font-size:13px}.bh small{display:block;color:var(--muted);font-size:11px}
.task{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line2);width:100%;text-align:left}
.task:hover{background:var(--linen)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--green)}
.dot.red{background:var(--red)}.dot.apricot{background:var(--apricot)}
.task b{display:block;font-size:12.5px;font-weight:700}.task span{display:block;font-size:11.5px;color:var(--muted)}

/* briefing */
.brief{background:var(--green);color:var(--linen);border-radius:20px;padding:18px}
.brief .play{width:48px;height:48px;border-radius:50%;background:var(--apricot);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.brief p{margin:6px 0 0;color:rgba(251,250,247,.45);font-size:13.5px;transition:color .3s}
.brief p.on{color:var(--linen)} .brief p.done{color:var(--on-green)}
.act{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:0}
.act b{display:block;font-size:12.5px}.act span{display:block;font-size:12px;color:var(--muted)}.act time{font-size:11px;color:#8A938F}

/* calls */
.split{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.4fr);gap:16px;align-items:start}
.citem{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.citem:hover{background:var(--linen)}
.citem.sel{background:var(--green-soft)}
.citem b{display:block;font-size:13.5px}.citem span{display:block;font-size:12px;color:var(--muted)}
.summary{background:var(--sand);border-radius:16px;padding:14px 16px;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fld small{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fld b{font-size:13.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:var(--white)}
.mode.on{border-color:var(--green);background:var(--green-soft)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--muted)}

/* week board */
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.col{background:var(--side);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:380px}
.col.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.col .dh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.col .dh b{font-size:13px}.col .dh span{font-size:11px;color:var(--muted)}
.jc{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:8px 10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px}
.jc:hover{box-shadow:0 4px 14px rgba(20,32,30,.08)}
.jc b{font-size:12.5px;line-height:1.3}.jc span{font-size:11px;color:var(--muted)}
.jc .t{font-size:11px;font-weight:800;color:var(--ink)}
.jc.done{opacity:.62}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--green)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,32,30,.38);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:32px 16px;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(480px,100%);height:100%;background:var(--linen);overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px)}to{transform:none}}
.modal{width:min(880px,100%);background:var(--linen);border-radius:24px;padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mh h2{margin:0;font-size:20px;letter-spacing:-.5px}
.x{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center}

/* translator */
.langbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:var(--linen);border-radius:16px;padding:12px 16px}
.langbar small{display:block;color:var(--on-green);font-size:11px;font-weight:700}
.langbar b{font-size:15px}
.convo{display:flex;flex-direction:column;gap:8px}
.bub{border-radius:16px;padding:10px 14px;max-width:80%;display:flex;flex-direction:column;gap:2px}
.bub.w{align-self:flex-end;background:var(--green-soft)} .bub.c{align-self:flex-start;background:var(--white);border:1px solid var(--line)}
.bub .l{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bub .o{font-size:13px;color:var(--muted)} .bub .big{font-size:17px;font-weight:700} .bub .gl{font-size:12px;color:#7A8481;font-style:italic}
.phr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phr button{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.phr button:hover{background:var(--sand)}

/* documents: A4 sheet */
.tabs{display:flex;gap:4px;background:var(--sand);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--white);color:var(--green)}
.docwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 40px rgba(20,32,30,.10);padding:44px 48px;color:#1b2422;font-size:12.5px;aspect-ratio:210/297;max-width:100%;display:flex;flex-direction:column}
.sheet .sh{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.sheet .co b{font-size:15px}
.sheet .co div,.sheet .meta div{color:#4b5653;font-size:11.5px;line-height:1.55}
.sheet h3{margin:28px 0 4px;font-size:24px;letter-spacing:-.6px;font-weight:700}
.sheet .meta{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:11.5px;text-align:right}
.sheet .meta span{color:#7b8582}
.sheet .bill{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:18px 0 22px}
.sheet .bill small{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:#7b8582;text-transform:uppercase;margin-bottom:4px}
.sheet table{width:100%;border-collapse:collapse;font-size:11.5px}
.sheet th{background:var(--sand);text-align:left;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;color:#4b5653}
.sheet td{padding:9px 10px;border-bottom:1px solid #eee9df}
.sheet .r{text-align:right;font-variant-numeric:tabular-nums}
.sheet .tot{margin-left:auto;width:270px;margin-top:14px;font-size:12px}
.sheet .tot div{display:flex;justify-content:space-between;padding:5px 10px}
.sheet .tot .grand{background:var(--green);color:#fff;border-radius:6px;font-weight:800;font-size:14px;padding:9px 10px;margin-top:4px}
.sheet .pay{margin-top:auto;display:grid;grid-template-columns:1fr 92px;gap:16px;border-top:1px solid #eee9df;padding-top:14px;font-size:11px;color:#4b5653}
.qr{width:92px;height:92px;border-radius:6px;background:conic-gradient(#1b2422 25%,#fff 0 50%,#1b2422 0 75%,#fff 0) 0 0/16px 16px;border:6px solid #fff;outline:1px solid #ddd}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:2px;transform:rotate(-6deg);font-size:14px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;position:relative}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl.on i{background:var(--green)}
.tl b{display:block;font-size:12.5px}.tl span{font-size:11.5px;color:var(--muted)}
.integ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.integ .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.bars .br{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bars .bar{height:12px;border-radius:6px;background:var(--sand);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:6px}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.switch{width:50px;height:30px;border-radius:15px;background:#CFC8BA;position:relative;flex-shrink:0;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]:after{transform:translateX(20px)}

/* voice */
.fab{position:fixed;right:28px;bottom:28px;z-index:30;width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--linen);display:grid;place-items:center;box-shadow:0 12px 30px rgba(31,77,69,.38)}
.fab:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--apricot-light);animation:ring 2.6s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.15);opacity:0}}
.voice{width:min(560px,100%);background:var(--green);color:var(--linen);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;margin-top:60px}
.orb{width:110px;height:110px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 50% 45%,var(--apricot-light),var(--apricot) 60%);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 14px rgba(242,165,122,.16)}
.orb.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 24px rgba(242,165,122,.2)}}
.said{font-size:19px;font-weight:600;text-align:center;min-height:56px}
.ex button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-top:6px;font-weight:600}
.plan{background:var(--linen);color:var(--ink);border-radius:16px;padding:12px 16px}
.plan .pr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.plan .pr:last-of-type{border-bottom:0}

.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{border:1.5px solid var(--line);background:var(--white);border-radius:12px;padding:8px 12px;text-align:left;display:flex;flex-direction:column;color:var(--ink)}

   <div class="brief"><div class="row"><span class="play" aria-hidden="true">${svg('moon',20)}</span><div><b>Ponoči</b><div style="color:var(--on-green);font-size:12px">Nočna pravila 22:00–6:00</div></div></div><p class="done">02:14 · Gost v 221 ne more v sobo. Nočno pravilo je nalogo poslalo dežurni vodji Tini.</p><p class="done">02:20 · Nova kartica izdana. 6 minut.</p><p class="done">Ostalih 5 manj nujnih prošenj je počakalo na jutranjo izmeno.</p></div>

function openJob(id){S.page='jobs';S.sel=id;closeLayer();render();window.scrollTo({top:0})}
function pJobs(){const list=JOBS.filter(j=>S.dep==='all'||typ(j.type).dep===S.dep).sort((a,b)=>(a.st===2)-(b.st===2)||(b.late||0)-(a.late||0)||b.t.localeCompare(a.t));const j=job(S.sel)||list[0];
  return head('Naloge','Vse naloge danes','Vsaka ima enega odgovornega in dva ciljna časa: za sprejem in za izvedbo.',`<button class="btn primary" onclick="openSim()">${svg('msg',16)}Simuliraj sporočilo</button>`)+
  `<div class="tabs" role="tablist" style="margin-bottom:14px"><button role="tab" aria-selected="${S.dep==='all'}" class="${S.dep==='all'?'on':''}" onclick="S.dep='all';render()">Vsi oddelki</button>${Object.values(DEP).map(d=>`<button role="tab" aria-selected="${S.dep===d.id}" class="${S.dep===d.id?'on':''}" onclick="S.dep='${d.id}';render()">${d.name}</button>`).join('')}</div>
  <div class="split"><div class="card">${list.map(x=>`<button class="citem ${j&&x.id===j.id?'sel':''}" onclick="S.sel=${x.id};render()"><span class="ic ${x.late?'red':x.st===2?'green':'sand'}">${svg(TIC[x.type])}</span><div class="grow"><b>Soba ${x.room} · ${esc(x.title)}</b><span>#${x.id} · ${x.t} · ${first(x.who)}</span></div>${stPill(x)}</button>`).join('')||'<div class="cb muted">Ni nalog.</div>'}</div>${j?jobDetail(j):''}</div>`}
function jobDetail(j){const T=typ(j.type),d=DEP[T.dep];
  return `<div class="card"><div class="ch"><div><h2>#${j.id} · Soba ${j.room} · ${esc(j.title)}</h2><p>${d.name} · ${esc(T.name)}${j.guest?' · gost čaka':''}</p></div><div class="btns">${stPill(j)}</div></div><div class="cb grid" style="gap:14px">
   <div class="fields"><div class="fld"><small>Odgovoren</small><b>${j.who?esc(STAFF[j.who].name):'Še nihče'}</b><div class="muted" style="font-size:12px">${j.who?esc(STAFF[j.who].role):'Ponujeno v izmeni'}</div></div><div class="fld"><small>Sprejem</small><b>v ${T.acc} min</b><div class="muted" style="font-size:12px">${j.acceptedAt?'sprejeto '+j.acceptedAt:'čaka od '+j.t}</div></div><div class="fld"><small>Izvedba</small><b>v ${T.fin} min</b><div class="muted" style="font-size:12px">${j.doneAt?'opravljeno '+j.doneAt:j.late?'zamuja '+j.late+' min':'teče'}</div></div></div>
   <div><b style="font-size:13px">Stopnjevanje</b><div class="ladder">${ESC.map((e,i)=>`<div class="rung ${i<=j.esc?'on':''} ${i===j.esc&&j.st<2&&i>0?'now':''}"><i>${i+1}</i><span>${e}</span></div>`).join('')}</div></div>
   <div class="btns">${j.st===0?`<button class="btn primary" onclick="assign(${j.id})">${svg('team',16)}Dodeli</button>`:''}${j.st===1?`<button class="btn primary" onclick="finish(${j.id})">${svg('check',16)}Označi kot opravljeno</button><button class="btn line" onclick="reassign(${j.id})">${svg('swap',16)}Dodeli drugemu</button>`:''}${j.st<2?`<button class="btn line" onclick="nudge(${j.id})">${svg('bell',16)}Opomni</button>`:''}${T.dep==='mnt'&&j.st<2?`<button class="btn line" onclick="toast('Naročeno pri zunanjem servisu. Soba ${j.room} je označena kot težava, dokler ni rešeno.')">${svg('wrench',16)}Zunanji serviser</button>`:''}</div>
   <div class="grid g2" style="gap:14px;align-items:start"><div><b style="font-size:13px">WhatsApp</b><div class="wa" style="margin-top:8px">${j.thread.map(m=>m[0]==='s'?`<div class="wam me">${m[1]==='voice'?`<span class="vn">${svg('play',12)}<i></i>0:06</span>`:esc(m[2])}<small>${first(j.by)} · ${m[3]}</small></div>`:`<div class="wam">${esc(m[1])}<small>Unbusyness · ${m[2]}</small></div>`).join('')}</div>${j.tr?`<div class="trbox"><small>Prevod</small>${esc(j.tr)}</div>`:''}</div>
   <div><b style="font-size:13px">Potek</b><div class="timeline" style="margin-top:4px">${j.log.map(l=>`<div class="tl on"><i></i><div><b>${esc(l[0])} · ${esc(l[1])}</b><span>${esc(l[2])}</span></div></div>`).join('')}</div></div></div>
  </div></div>`}
function pick(id,title,cb){const j=job(id),dep=typ(j.type).dep,ppl=Object.values(STAFF).filter(s=>s.dep===dep&&s.id!==j.who);S.pickCb=cb;
  layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-label="${title}" style="width:min(560px,100%)"><div class="mh"><h2>${title}</h2><button class="x" onclick="closeLayer()" aria-label="Zapri">${svg('x')}</button></div><div class="who">${ppl.map(s=>`<button onclick="S.pickCb('${s.id}')" ${s.on?'':'disabled style="opacity:.5"'}><b>${esc(s.name)}</b><span>${esc(s.role)} · ${s.on?'v izmeni':'ni v izmeni'} · ${s.lang}</span></button>`).join('')}</div><p class="muted" style="margin:0;font-size:13px">Izbrani dobi nalogo na WhatsApp v svojem jeziku in jo sprejme z enim dotikom.</p></div></div>`)}
function assign(id){pick(id,'Komu dodelim?',k=>{const j=job(id);j.who=k;j.st=1;j.acceptedAt=HOTEL.now;j.log.push([HOTEL.now,'Dodeljeno: '+STAFF[k].name,'Sprejeto na WhatsApp.']);closeLayer();render();toast(`${STAFF[k].name} je dobil(a) nalogo in jo sprejel(a).`)})}
function reassign(id){pick(id,'Dodeli drugemu',k=>{const j=job(id),old=first(j.who);j.who=k;j.late=0;j.log.push([HOTEL.now,'Predodeljeno: '+STAFF[k].name,old+' je obveščen(a), da naloge nima več.']);closeLayer();render();toast(`Predodeljeno: ${STAFF[k].name}. Ciljni čas teče znova.`)})}
function finish(id){const j=job(id);j.st=2;j.late=0;j.doneAt=HOTEL.now;j.log.push([HOTEL.now,'Opravljeno','Prijavitelj obveščen.']);render();toast(`Opravljeno. ${first(j.by)} je dobil(a) potrditev na WhatsApp.`)}
function nudge(id){const j=job(id);toast(j.who?`${first(j.who)} je dobil(a) opomnik na WhatsApp.`:'Ponovno ponujeno vsem v izmeni.')}

/* ---------- simulate a staff message ---------- */
const SIMS=[
 {label:'Glasovno sporočilo v ukrajinščini',who:'ivana',voice:true,orig:'«Номер 309, у ванній не працює світло.»',tr:'Soba 309: v kopalnici ne dela luč.',jobs:[{room:'309',type:'elec',title:'Luč v kopalnici ne dela',dep:'mnt',to:'marko'}]},
 {label:'Eno sporočilo, dve nalogi',who:'nina',orig:'»Soba 226 rabi otroško posteljico, pa daljinec za TV ne dela.«',jobs:[{room:'226',type:'bed',title:'Otroška posteljica',dep:'hk',to:'nina'},{room:'226',type:'tv',title:'Daljinec za TV ne dela',dep:'it',to:'jure'}]},
 {label:'Fotografija z recepcije',who:'ana',photo:true,orig:'»Fotografija: madež na preprogi na hodniku 1. nadstropja.«',jobs:[{room:'Hodnik 1',type:'clean',title:'Madež na preprogi na hodniku',dep:'hk',to:'amir'}]},
];
function openSim(){S.sim={i:null,step:0};drawSim()}
function drawSim(){const s=S.sim;if(!s)return;const c=s.i!=null?SIMS[s.i]:null;
  layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-label="Simuliraj sporočilo" style="width:min(640px,100%)"><div class="mh"><h2>${svg('msg',18)} Sporočilo osebja na WhatsApp</h2><button class="x" onclick="closeLayer()" aria-label="Zapri">${svg('x')}</button></div>
  ${!c?`<p class="muted" style="margin:0">Izberite primer. Osebje piše kot vedno, Unbusyness razume, razdeli in dodeli.</p><div class="who" style="grid-template-columns:1fr">${SIMS.map((x,i)=>`<button onclick="runSim(${i})"><b>${x.label}</b><span>${esc(STAFF[x.who].name)}: ${esc(x.orig)}</span></button>`).join('')}</div>`:
  `<div class="wa">${s.step>=1?`<div class="wam me">${c.voice?`<span class="vn">${svg('play',12)}<i></i>0:05</span>`:c.photo?`<span class="vn">${svg('cam',14)} Fotografija</span>${esc(c.orig.replace('»Fotografija: ','»'))}`:esc(c.orig)}<small>${first(c.who)} · zdaj</small></div>`:''}
   ${s.step>=2&&c.tr?`<div class="trbox"><small>Razumljeno in prevedeno</small>${esc(c.orig)} → ${esc(c.tr)}</div>`:''}
   ${s.step>=3?`<div class="wam">${c.jobs.length>1?`Dve nalogi: ${c.jobs.map(x=>`${esc(x.title)} (${DEP[x.dep].name}, ${first(x.to)})`).join(' in ')}.`:`Naloga: soba ${esc(c.jobs[0].room)}, ${esc(c.jobs[0].title.toLowerCase())}. Poslano: ${first(c.jobs[0].to)} (${DEP[c.jobs[0].dep].name}).`}<small>Unbusyness · zdaj</small></div>`:''}
   ${s.step>=4?c.jobs.map(x=>`<div class="wam">${first(x.to)} je sprejel(a).<small>Unbusyness · zdaj</small></div>`).join(''):''}</div>
   ${s.step>=4?`<div class="okbox">${svg('check',18)}<div><b>${c.jobs.length>1?'Ustvarjeni nalogi':'Ustvarjena naloga'}</b> z odgovornim in ciljnim časom. ${c.voice?'Marko jo je dobil v slovenščini.':''}</div></div><div class="btns"><button class="btn primary" onclick="addSim()">Odpri v nalogah</button><button class="btn line" onclick="S.sim={i:null,step:0};drawSim()">Še en primer</button></div>`:''}`}
  </div></div>`)}
function runSim(i){S.sim={i,step:0};const c=SIMS[i];const go=()=>{if(!S.sim||S.sim.i!==i)return;S.sim.step++;if(S.sim.step===2&&!c.tr)S.sim.step++;drawSim();if(S.sim.step<4)setTimeout(go,1100)};go()}
function addSim(){const c=SIMS[S.sim.i];let last;c.jobs.forEach((x,k)=>{const id=Math.max(...JOBS.map(j=>j.id))+1;last=id;JOBS.unshift({id,room:x.room,type:x.type,title:x.title,by:c.who,ch:c.voice?'voice':'text',t:HOTEL.now,who:x.to,st:1,acceptedAt:HOTEL.now,esc:0,tr:c.tr,orig:c.orig,
  thread:[['s',c.voice?'voice':'text',c.orig,HOTEL.now],['b',`Naloga #${id}: ${x.title}. Poslano: ${first(x.to)}.`,HOTEL.now],['b',`${first(x.to)} je sprejel(a).`,HOTEL.now]],log:[[HOTEL.now,c.voice?'Glasovno sporočilo razumljeno':'Sporočilo razumljeno',c.tr?'Prevedeno: '+c.tr:''],[HOTEL.now,first(x.to)+' sprejel(a)','']]})});S.sel=last;S.sim=null;S.dep='all';openJob(last)}

/* ---------- Sobe ---------- */
function pRooms(){const cnt=k=>ROOMS.filter(r=>r.st===k).length;
  return head('Sobe',`${HOTEL.rooms} sob v ${HOTEL.floors} nadstropjih`,'Stanje sob in odprte naloge na enem mestu. Kliknite sobo.')+
  `<div class="legend" style="margin-bottom:14px">${Object.entries(RST).map(([k,[l,c]])=>`<span><i style="background:${c}"></i>${l} · ${cnt(k)}</span>`).join('')}</div>
  ${[4,3,2,1].map(f=>`<div class="card cb" style="margin-bottom:12px"><b>${f}. nadstropje</b><div class="rgrid">${ROOMS.filter(r=>r.f===f).map(r=>{const js=JOBS.filter(j=>j.room===r.id&&j.st<2);return `<button class="room" style="--c:${RST[r.st][1]}" onclick="roomInfo('${r.id}')" aria-label="Soba ${r.id}, ${RST[r.st][0]}${js.length?', odprte naloge: '+js.length:''}">${r.id}${js.length?`<span class="rb">${js.length}</span>`:''}</button>`}).join('')}</div></div>`).join('')}`}
function roomInfo(id){const r=ROOMS.find(x=>x.id===id),js=JOBS.filter(j=>j.room===id);
  layer(`<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="drawer" role="dialog" aria-label="Soba ${id}"><div class="mh"><div><div class="eyebrow">Soba</div><h2>${id}</h2></div><button class="x" onclick="closeLayer()" aria-label="Zapri">${svg('x')}</button></div>
  <div class="fields"><div class="fld"><small>Stanje</small><b>${RST[r.st][0]}</b></div><div class="fld"><small>Nadstropje</small><b>${r.f}.</b></div><div class="fld"><small>Sobarica</small><b>${r.f===1?'Amir':r.f===2?'Nina':'Ivana'}</b></div></div>
  <b>Naloge</b><div class="card">${js.length?js.map(j=>`<button class="citem" onclick="openJob(${j.id})"><span class="ic sand">${svg(TIC[j.type])}</span><div class="grow"><b>${esc(j.title)}</b><span>#${j.id} · ${j.t}</span></div>${stPill(j)}</button>`).join(''):'<div class="cb muted">Danes ni nalog za to sobo.</div>'}</div>
  <b>Zgodovina (30 dni)</b><div class="card cb muted" style="font-size:13px">${id==='118'?'Klima: 3 prijave v 30 dneh. Predlog: servis klimatske naprave pri zunanjem izvajalcu.':'Brez ponavljajočih se težav.'}</div></div></div>`)}

/* ---------- Ekipa ---------- */
function pTeam(){return head('Ekipa in izmene','Kdo je danes v izmeni','Naloge dobi prava oseba glede na oddelek, nadstropje in izmeno, v svojem jeziku.')+
  `<div class="grid g3">${Object.values(DEP).map(d=>`<div class="card"><div class="ch"><h2><span class="sw" style="background:${d.color}"></span>${d.name}</h2></div>${Object.values(STAFF).filter(s=>s.dep===d.id).map(s=>`<div class="need"><span class="av2">${s.name.split(' ').map(x=>x[0]).join('')}</span><div class="grow"><b>${esc(s.name)}${s.lead?' · vodja':''}${s.duty?' · dežurna':''}</b><span>${esc(s.role)} · ${s.lang} · ${JOBS.filter(j=>j.who===s.id&&j.st<2).length} odprtih</span></div><button class="switch" role="switch" aria-checked="${s.on}" aria-label="V izmeni: ${esc(s.name)}" onclick="STAFF['${s.id}'].on=!STAFF['${s.id}'].on;render();toast(STAFF['${s.id}'].on?'${esc(s.name)} je v izmeni in prejema naloge.':'${esc(s.name)} ne prejema več nalog.')"></button></div>`).join('')}</div>`).join('')}</div>`}

/* ---------- Pravila ---------- */
function pRules(){return head('Pravila in ciljni časi','Vaša pravila','Ista situacija, vedno isti rezultat. Spremenite čas in velja takoj.')+
  `<div class="card tscroll"><table class="tbl"><thead><tr><th>Vrsta prošnje</th><th>Oddelek</th><th class="num">Sprejem (min)</th><th class="num">Izvedba (min)</th><th>Ponoči</th></tr></thead><tbody>${TYPES.map((t,i)=>`<tr><td><span class="row" style="gap:8px">${svg(TIC[t.id],16)}<b>${esc(t.name)}</b></span></td><td>${DEP[t.dep].name}</td><td class="num"><input class="numin" type="number" min="1" max="240" value="${t.acc}" aria-label="Sprejem ${esc(t.name)}" onchange="TYPES[${i}].acc=+this.value;toast('Shranjeno: ${esc(t.name)}, sprejem v '+this.value+' min')"></td><td class="num"><input class="numin" type="number" min="5" max="600" value="${t.fin}" aria-label="Izvedba ${esc(t.name)}" onchange="TYPES[${i}].fin=+this.value;toast('Shranjeno: ${esc(t.name)}, izvedba v '+this.value+' min')"></td><td>${t.night?pill('Takoj dežurnemu','red'):pill('Počaka na jutro','slate')}</td></tr>`).join('')}</tbody></table></div>
  <div class="grid g2" style="margin-top:16px;align-items:start"><div class="card cb" style="display:grid;gap:10px"><b>Stopnjevanje</b>${ESC.map((e,i)=>`<div class="row" style="gap:10px"><span class="step2">${i+1}</span><div><b style="font-size:13.5px">${e}</b><div class="muted" style="font-size:12.5px">${['dobi nalogo takoj','če ni sprejeto v ciljnem času','če ni opravljeno v ciljnem času','še odprto ali ponoči (22:00–6:00)'][i]}</div></div></div>`).join('')}</div>
  <div class="card cb" style="display:grid;gap:12px"><b>Odobritve</b><label class="row" style="gap:10px"><button class="switch" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')" aria-label="Odobritev zunanjega serviserja"></button>Zunanji serviser nad 200 € čaka na odobritev vodje</label><label class="row" style="gap:10px"><button class="switch" role="switch" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')" aria-label="Preverjanje odgovorov"></button>Vsak odgovor preverjen za osebne podatke pred pošiljanjem</label><label class="row" style="gap:10px"><button class="switch" role="switch" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')!=='true')" aria-label="Povzetek ob 18:00"></button>Povzetek dneva na WhatsApp ob 18:00</label></div></div>`}

/* ---------- Poročila ---------- */
function pReports(){const wk=['T42','T43','T44','T45'];const max=45;
  return head('Poročila','Kako hitro se odzivamo','Povprečen čas od prijave do opravljenega, po tednih.')+
  `<div class="grid g4" style="margin-bottom:16px">${stat('Prošenj ta teden','341','+8 % glede na prejšnji','list','green')}${stat('Pravočasno','91 %','cilj 90 %','check','green')}${stat('Zamujenih','29','največ: vzdrževanje','alert','red')}${stat('Uporabnikov na teden','24','od 26 zaposlenih','team','slate')}</div>
  <div class="grid g2" style="align-items:start"><div class="card"><div class="ch"><div><h2>Čas popravila po oddelkih</h2><p>minute, zadnji 4 tedni</p></div></div><div class="cb">${Object.values(DEP).map(d=>`<div class="wrow"><span>${d.name}</span><div class="wbars">${WEEK[d.id].map((v,i)=>`<i style="height:${v/max*56}px;background:${d.color};opacity:${.45+i*.18}" title="${wk[i]}: ${v} min"></i>`).join('')}</div><b>${WEEK[d.id][3]} min</b></div>`).join('')}<div class="muted" style="font-size:12px;margin-top:6px">Stolpci: tedni ${wk.join(', ')}</div></div></div>
  <div class="card"><div class="ch"><div><h2>Sobe, ki se ponavljajo</h2><p>3 ali več prijav v 30 dneh</p></div></div>${[['118','Klima','3 prijave','Predlog: servis klime'],['214','Tuš','3 prijave','Predlog: zamenjava armature'],['402','Ponovno čiščenje','2 pritožbi gostov','Predlog: preverjanje po čiščenju']].map(r=>`<div class="need"><span class="ic apricot">${svg('alert')}</span><div class="grow"><b>Soba ${r[0]} · ${r[1]}</b><span>${r[2]} · ${r[3]}</span></div></div>`).join('')}</div></div>`}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer()});
render();

</script>
