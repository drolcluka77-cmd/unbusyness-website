<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Unbusyness Business</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: desktop workspace — sidebar nav, sticky top bar, content area with cards; documents open as A4 sheets; same tokens as the phone demo. */
:root{
  --green:#1F4D45; --green-dark:#173D37; --green-soft:#E6EEEB; --on-green:#CFE0DA;
  --apricot:#E8915F; --apricot-light:#F2A57A; --apricot-ink:#A84E22; --apricot-soft:#FBE8DC;
  --slate:#4F5F80; --slate-soft:#E9ECF3;
  --sand:#F4EFE6; --linen:#FBFAF7; --white:#FFFFFF; --side:#FDFCFA;
  --ink:#14201E; --muted:#56615F; --line:#E7E3DA; --line2:#EFEBE3;
  --red:#B23A32; --red-soft:#FBEAE8; --ok:#2F7A55; --ok-soft:#E4F1E8;
  --font:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:20px;font-weight:700;letter-spacing:-.6px}
.ws{margin:0 4px;background:var(--sand);border-radius:14px;padding:11px 12px;display:flex;gap:10px;align-items:center}
.ws .av{width:32px;height:32px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:12px}
.ws small{display:block;color:var(--muted);font-size:11px}
.navlabel{font-size:10px;font-weight:700;letter-spacing:1.6px;color:#8A938F;padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav button:hover{background:var(--sand)}
.nav button.on{background:var(--green-soft);color:var(--green);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
.nav .cnt.hot{background:var(--red);border-color:var(--red);color:#fff}
.sidecard{margin-top:auto;background:var(--sand);border-radius:16px;padding:14px;font-size:12px;color:var(--muted)}
.sidecard b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}

.main{min-width:0}
.top{height:66px;position:sticky;top:0;z-index:10;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:16px}
.crumb{color:var(--muted);font-size:13px}
.crumb b{color:var(--ink)}
.topr{display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.user{display:flex;align-items:center;gap:9px;padding-left:10px;border-left:1px solid var(--line);font-size:12px}
.user .av{width:36px;height:36px;border-radius:50%;background:var(--apricot-soft);color:var(--apricot-ink);display:grid;place-items:center;font-weight:700}
.offpill{display:flex;align-items:center;gap:8px;background:var(--slate);color:#fff;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.content{max-width:1360px;margin:0 auto;padding:28px 32px 120px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.8px;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.head h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-1.1px}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--green);color:var(--linen)}
.btn.primary:hover{background:var(--green-dark)}
.btn.apricot{background:var(--apricot);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.line{background:var(--white);border:1px solid var(--line)}
.btn.line:hover{background:var(--sand)}
.btn.sm{min-height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gmain{grid-template-columns:minmax(0,1.65fr) minmax(300px,1fr);align-items:start}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.ch p{margin:2px 0 0;color:var(--muted);font-size:12px}
.cb{padding:16px 20px}
.stat{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.stat .lbl{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}
.stat .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green)}
.stat b{font-size:27px;font-weight:700;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.red{background:var(--red-soft);color:var(--red)} .pill.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.slate{background:var(--slate-soft);color:var(--slate)} .pill.ink{background:var(--ink);color:var(--linen)}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.ic.green{background:var(--green-soft);color:var(--green)} .ic.red{background:var(--red-soft);color:var(--red)} .ic.apricot{background:var(--apricot-soft);color:var(--apricot-ink)} .ic.slate{background:var(--slate-soft);color:var(--slate)} .ic.sand{background:var(--sand);color:var(--green)}
.explain{display:flex;gap:10px;align-items:flex-start;background:var(--apricot-soft);border-radius:14px;padding:12px 14px;font-size:13px;color:#5A3A26;line-height:1.5}
.explain b{color:var(--apricot-ink)}
.explain .ei{width:22px;height:22px;border-radius:50%;background:var(--white);color:var(--apricot-ink);display:grid;place-items:center;flex-shrink:0;font-weight:800;font-size:12px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--linen)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}

/* task node tree */
.root{background:var(--green);color:var(--linen);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.root .ri{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:var(--apricot-light);display:grid;place-items:center}
.root small{display:block;font-size:10px;letter-spacing:1.4px;color:var(--on-green);font-weight:700}
.stem{width:1px;height:18px;background:#CFC8BA;margin:0 auto}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bh{display:flex;align-items:center;gap:10px;padding:12px;background:var(--side)}
.bh strong{display:block;font-size:13px}.bh small{display:block;color:var(--muted);font-size:11px}
.task{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line2);width:100%;text-align:left}
.task:hover{background:var(--linen)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--green)}
.dot.red{background:var(--red)}.dot.apricot{background:var(--apricot)}
.task b{display:block;font-size:12.5px;font-weight:700}.task span{display:block;font-size:11.5px;color:var(--muted)}

/* briefing */
.brief{background:var(--green);color:var(--linen);border-radius:20px;padding:18px}
.brief .play{width:48px;height:48px;border-radius:50%;background:var(--apricot);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.brief p{margin:6px 0 0;color:rgba(251,250,247,.45);font-size:13.5px;transition:color .3s}
.brief p.on{color:var(--linen)} .brief p.done{color:var(--on-green)}
.act{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.act:last-child{border-bottom:0}
.act b{display:block;font-size:12.5px}.act span{display:block;font-size:12px;color:var(--muted)}.act time{font-size:11px;color:#8A938F}

/* calls */
.split{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.4fr);gap:16px;align-items:start}
.citem{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.citem:hover{background:var(--linen)}
.citem.sel{background:var(--green-soft)}
.citem b{display:block;font-size:13.5px}.citem span{display:block;font-size:12px;color:var(--muted)}
.summary{background:var(--sand);border-radius:16px;padding:14px 16px;font-size:14px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fld{border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.fld small{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fld b{font-size:13.5px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;background:var(--white)}
.mode.on{border-color:var(--green);background:var(--green-soft)}
.mode b{display:block;font-size:14px}.mode span{font-size:12px;color:var(--muted)}

/* week board */
.weekhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;min-width:1080px}
.col{background:var(--side);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:380px}
.col.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.col .dh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 6px}
.col .dh b{font-size:13px}.col .dh span{font-size:11px;color:var(--muted)}
.jc{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:8px 10px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px}
.jc:hover{box-shadow:0 4px 14px rgba(20,32,30,.08)}
.jc b{font-size:12.5px;line-height:1.3}.jc span{font-size:11px;color:var(--muted)}
.jc .t{font-size:11px;font-weight:800;color:var(--ink)}
.jc.done{opacity:.62}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.steps{display:flex;gap:5px}
.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--green)}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(20,32,30,.38);z-index:40;display:flex;justify-content:flex-end;animation:fade .15s ease}
.scrim.center{justify-content:center;align-items:flex-start;padding:32px 16px;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.drawer{width:min(480px,100%);height:100%;background:var(--linen);overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px)}to{transform:none}}
.modal{width:min(880px,100%);background:var(--linen);border-radius:24px;padding:22px 24px 26px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.mh h2{margin:0;font-size:20px;letter-spacing:-.5px}
.x{width:38px;height:38px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:grid;place-items:center}

/* translator */
.langbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:var(--linen);border-radius:16px;padding:12px 16px}
.langbar small{display:block;color:var(--on-green);font-size:11px;font-weight:700}
.langbar b{font-size:15px}
.convo{display:flex;flex-direction:column;gap:8px}
.bub{border-radius:16px;padding:10px 14px;max-width:80%;display:flex;flex-direction:column;gap:2px}
.bub.w{align-self:flex-end;background:var(--green-soft)} .bub.c{align-self:flex-start;background:var(--white);border:1px solid var(--line)}
.bub .l{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.bub .o{font-size:13px;color:var(--muted)} .bub .big{font-size:17px;font-weight:700} .bub .gl{font-size:12px;color:#7A8481;font-style:italic}
.phr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phr button{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:10px 12px;text-align:left;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.phr button:hover{background:var(--sand)}

/* documents: A4 sheet */
.tabs{display:flex;gap:4px;background:var(--sand);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--white);color:var(--green)}
.docwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 40px rgba(20,32,30,.10);padding:44px 48px;color:#1b2422;font-size:12.5px;aspect-ratio:210/297;max-width:100%;display:flex;flex-direction:column}
.sheet .sh{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.sheet .co b{font-size:15px}
.sheet .co div,.sheet .meta div{color:#4b5653;font-size:11.5px;line-height:1.55}
.sheet h3{margin:28px 0 4px;font-size:24px;letter-spacing:-.6px;font-weight:700}
.sheet .meta{display:grid;grid-template-columns:auto auto;gap:2px 16px;font-size:11.5px;text-align:right}
.sheet .meta span{color:#7b8582}
.sheet .bill{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:18px 0 22px}
.sheet .bill small{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.2px;color:#7b8582;text-transform:uppercase;margin-bottom:4px}
.sheet table{width:100%;border-collapse:collapse;font-size:11.5px}
.sheet th{background:var(--sand);text-align:left;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:8px 10px;color:#4b5653}
.sheet td{padding:9px 10px;border-bottom:1px solid #eee9df}
.sheet .r{text-align:right;font-variant-numeric:tabular-nums}
.sheet .tot{margin-left:auto;width:270px;margin-top:14px;font-size:12px}
.sheet .tot div{display:flex;justify-content:space-between;padding:5px 10px}
.sheet .tot .grand{background:var(--green);color:#fff;border-radius:6px;font-weight:800;font-size:14px;padding:9px 10px;margin-top:4px}
.sheet .pay{margin-top:auto;display:grid;grid-template-columns:1fr 92px;gap:16px;border-top:1px solid #eee9df;padding-top:14px;font-size:11px;color:#4b5653}
.qr{width:92px;height:92px;border-radius:6px;background:conic-gradient(#1b2422 25%,#fff 0 50%,#1b2422 0 75%,#fff 0) 0 0/16px 16px;border:6px solid #fff;outline:1px solid #ddd}
.stamp{display:inline-block;border:2px solid var(--ok);color:var(--ok);border-radius:6px;padding:2px 10px;font-weight:800;letter-spacing:2px;transform:rotate(-6deg);font-size:14px}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;position:relative}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--line);margin-top:4px;flex-shrink:0}
.tl.on i{background:var(--green)}
.tl b{display:block;font-size:12.5px}.tl span{font-size:11.5px;color:var(--muted)}
.integ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.integ .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.bars .br{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.bars .bar{height:12px;border-radius:6px;background:var(--sand);overflow:hidden}
.bars .bar i{display:block;height:100%;border-radius:6px}
.bars b{text-align:right;font-variant-numeric:tabular-nums}
.switch{width:50px;height:30px;border-radius:15px;background:#CFC8BA;position:relative;flex-shrink:0;transition:background .2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]:after{transform:translateX(20px)}

/* voice */
.fab{position:fixed;right:28px;bottom:28px;z-index:30;width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--linen);display:grid;place-items:center;box-shadow:0 12px 30px rgba(31,77,69,.38)}
.fab:after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--apricot-light);animation:ring 2.6s ease-out infinite;opacity:0}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.15);opacity:0}}
.voice{width:min(560px,100%);background:var(--green);color:var(--linen);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;margin-top:60px}
.orb{width:110px;height:110px;border-radius:50%;margin:8px auto;background:radial-gradient(circle at 50% 45%,var(--apricot-light),var(--apricot) 60%);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 14px rgba(242,165,122,.16)}
.orb.live{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 24px rgba(242,165,122,.2)}}
.said{font-size:19px;font-weight:600;text-align:center;min-height:56px}
.ex button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 14px;margin-top:6px;font-weight:600}
.plan{background:var(--linen);color:var(--ink);border-radius:16px;padding:12px 16px}
.plan .pr{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.plan .pr:last-of-type{border-bottom:0}

function playBrief(){const L=briefLines();if(S.playing){S.playing=false;hush();clearInterval(window._bt);render();return}
 S.playing=true;S.line=0;render();let started=false;
 const fin=()=>{clearInterval(window._bt);S.playing=false;S.line=99;render()};
 const timed=()=>{clearInterval(window._bt);window._bt=setInterval(()=>{if(!S.playing){clearInterval(window._bt);return}S.line++;if(S.line>=L.length)fin();else render()},1800)};
 if(!TTS){timed();return} hush();const v=pickV('en-US');
 L.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(l);u.lang='en-US';if(v)u.voice=v;u.onstart=()=>{started=true;if(S.playing){S.line=i;render()}};if(i===L.length-1)u.onend=()=>{if(S.playing)fin()};TTS.speak(u)});

function drawPhoto(){const L=S.ph.label,id=S.ph.id;
 layer(`<div class="scrim center" onclick="if(event.target===this)openJob('${id}')"><div class="modal" style="width:min(620px,100%)" role="dialog" aria-label="Add a photo">
  <div class="mh"><h2>Add a photo · ${esc(job(id).what)}</h2><button class="x" onclick="openJob('${id}')" aria-label="Close">${svg('x')}</button></div>
  <div class="eyebrow" style="margin:0">1 · What is it? (required)</div>
  <div class="lblpick"><button class="${L==='job'?'on':''}" aria-pressed="${L==='job'}" onclick="S.ph.label='job';drawPhoto()"><b>${svg('cam',18)}Job photo</b><span>The problem, before and after, finished work</span></button><button class="${L==='invoice'?'on':''}" aria-pressed="${L==='invoice'}" onclick="S.ph.label='invoice';drawPhoto()"><b>${svg('receipt',18)}Invoice</b><span>Supplier invoice or receipt for parts. Goes to Received invoices.</span></button></div>
  <div class="eyebrow" style="margin:4px 0 0">2 · Add the photo</div>
  <div class="btns"><label class="btn primary ${L?'':'off'}" for="phIn" aria-disabled="${!L}">${svg('dl',16)}Upload a photo</label><input id="phIn" type="file" accept="image/*" hidden onchange="gotPhoto(this)"><button class="btn line ${L?'':'off'}" onclick="addPhoto(null,false)">Use an example photo</button><button class="btn line ${L?'':'off'}" onclick="addPhoto(null,true)">Try a wrong photo (see the AI check)</button></div>
  ${explain(L==='invoice'?'<b>The AI reads it.</b> Supplier, invoice number, date, items, VAT and total are filled in and the cost is linked to this job. If the photo is not an invoice, or is too blurry, it is flagged instead of being added to expenses.':L==='job'?'<b>Job photos stay with the job.</b> They protect you in disputes and can be attached to the customer’s invoice. If the AI sees a receipt instead, it suggests moving it.':'<b>Photos are optional.</b> Pick a label first, so job photos and invoices for parts never get mixed up.')}
 </div></div>`)}
function gotPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;addPhoto(URL.createObjectURL(f),false,true)}
function addPhoto(src,wrong,real){const id=S.ph.id,j=job(id),L=S.ph.label;if(!L)return;const p={label:L,src};(j.photos=j.photos||[]).push(p);
 if(L==='invoice'){const r=wrong?RCV('r'+Date.now(),'—','—','22 Oct 2026','No invoice found in the photo',id,'Janez',0,'wrong','This looks like a photo of the work, not an invoice. Nothing was added to expenses.')
   :real?RCV('r'+Date.now(),'Check supplier','—','22 Oct 2026','Read from your photo',id,'Janez',0,'check','Demo: in the app the AI fills in supplier, number, VAT and total from your photo here. Please confirm.')
   :RCV('r'+Date.now(),'Merkur d.o.o.','MER-2026-48390','22 Oct 2026','Valve and seals',id,'Janez',36.60,'ok');
  S.received.unshift(r);p.rid=r.id;if(wrong)p.flag='Labelled as invoice, but it looks like a photo of the work.'}
 else if(wrong)p.flag='Labelled as job photo, but it looks like a receipt from Merkur.';
 render();openJob(id);toast(wrong?'AI check: this photo does not match its label.':L==='invoice'?(real?'Invoice photo added. Check the details in Received invoices.':'AI read Merkur d.o.o. €36.60 and added it to expenses.'):'Job photo saved to the job.')}
function receiptHTML(r){const net=r.total/1.22;return `<div class="receipt ${r.status==='check'?'blur':''}"><b>${esc(r.supplier.toUpperCase())}</b><div>VAT ID SI 9xxxxxxx (example)</div><hr><div class="rr"><span>Invoice</span><span>${esc(r.no)}</span></div><div class="rr"><span>Date</span><span>${esc(r.date)}</span></div><hr><div>${esc(r.items)}</div><hr><div class="rr"><span>Net</span><span>${eur2(net)}</span></div><div class="rr"><span>VAT 22%</span><span>${eur2(r.total-net)}</span></div><div class="rr"><b>TOTAL</b><b>${eur2(r.total)}</b></div></div>`}
function rStatus(r){return r.status==='ok'?'<span class="pill ok">Read by AI · in expenses</span>':r.status==='check'?'<span class="pill apricot">Please confirm</span>':'<span class="pill red">Wrong photo?</span>'}
function openReceived(id){const r=rcv(id);if(!r)return;const net=r.total/1.22,j=job(r.job),w=j&&j.crew?CREW[j.crew]:null;
 layer(`<div class="scrim" onclick="if(event.target===this)closeLayer()"><div class="drawer" role="dialog" aria-label="Received invoice">
  <div class="mh"><div><div class="eyebrow">Received invoice · uploaded by ${esc(r.by)}</div><h2>${r.status==='wrong'?'Not an invoice?':esc(r.supplier)}</h2></div><button class="x" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  ${rStatus(r)}
  ${r.status==='wrong'?`<div class="wrongpic">Photo from ${esc(r.by)} · ${esc(r.date)}</div>`:receiptHTML(r)}
  ${r.status==='wrong'?`<div class="flagbox"><span class="ei">!</span><div><b>AI check:</b> ${esc(r.note)}</div></div>`:r.status==='check'?`<div class="explain"><span class="ei">!</span><div><b>AI check:</b> ${esc(r.note)}</div></div>`:`<div class="okbox">${svg('check',18)}<div><b>Read by AI.</b> Matches the label, VAT checked, linked to the job and added to October expenses.</div></div>`}
  ${r.status!=='wrong'?`<div class="card cb grid" style="gap:8px"><div class="eyebrow" style="margin:0">What the AI read</div><div class="fields" style="grid-template-columns:1fr 1fr"><div class="fld"><small>Supplier</small><b>${esc(r.supplier)}</b></div><div class="fld"><small>Invoice no.</small><b>${esc(r.no)}</b></div><div class="fld"><small>Date</small><b>${esc(r.date)}</b></div><div class="fld"><small>Items</small><b>${esc(r.items)}</b></div><div class="fld"><small>Net + VAT 22%</small><b>${eur2(net)} + ${eur2(r.total-net)}</b></div><div class="fld"><small>Total</small><b>${eur2(r.total)}</b></div></div></div>`:''}
  <div class="card cb"><div class="eyebrow" style="margin:0">Cost belongs to</div><b>${esc(rJob(r))}</b></div>
  <div class="btns">${r.status==='wrong'?`${j?`<button class="btn primary" onclick="moveToJob('${r.job}',job('${r.job}').photos.findIndex(p=>p.rid==='${r.id}'))">Move to job photos</button>`:''}<button class="btn soft" onclick="toast('${w?`${w.name} got a message in ${w.lang}: please photograph the invoice.`:'Reminder added.'}')">${svg('send',16)}Ask ${w?esc(w.name):''} for the invoice</button>`:r.status==='check'?`<button class="btn primary" onclick="rcv('${r.id}').status='ok';render();openReceived('${r.id}');toast('Confirmed and added to expenses.')">${svg('check',16)}Confirm ${eur2(r.total)}</button><button class="btn soft" onclick="toast('${w?`${w.name} got a message in ${w.lang}: please take a sharper photo.`:'Retake the photo.'}')">Ask for a sharper photo</button>`:`<button class="btn line" onclick="toast('Opening the original photo.')">${svg('dl',16)}Original photo</button><button class="btn line" onclick="toast('Pick another job for this cost.')">Change job</button>`}</div>
  ${explain('<b>Received invoices</b> collect every supplier invoice the team photographs. With QuickBooks, Xero or Zoho Books connected, they sync as bills; otherwise they stay in Unbusyness basic accounting.')}
 </div></div>`)}
function advance(id){const j=job(id);
 if(j.status===2||j.status===3){j.status=4;const amt=Math.round(j.price*1.22);S.invoices.unshift({id:'i'+Date.now(),no:'INV-2026-0160',name:j.name,what:j.what,amount:amt,ago:0,status:'unpaid',issued:'22 Oct 2026',due:'30 Oct 2026',overdue:false,lines:linesFor(amt,j.what),viewed:false});closeLayer();render();toast(`Invoice INV-2026-0160 sent to ${j.name.split(' ')[0]}: ${eur(amt)}.`);return}
 if(j.status===4){j.status=5;const i=S.invoices.find(x=>x.name===j.name&&x.status==='unpaid');if(i)i.status='paid';closeLayer();render();toast('Marked as paid. Review request sent.');return}
 j.status++;openJob(id);render();toast(j.status===1?`${j.name.split(' ')[0]} got a text: you're on your way.`:'Job started. Timer running.')}

/* ---------- translator & briefing (modal) ---------- */
function openTalk(){S.talk={log:[],wi:0,ci:0};drawTalk()}
function drawTalk(){const t=S.talk,wDone=t.wi>=TALK_W.length,cDone=t.ci>=TALK_C.length,cTurn=t.wi>t.ci&&!cDone;
 layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-label="Live translator">
  <div class="mh"><h2>Live translator</h2><button class="x" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  <div class="langbar"><div><small>WORKER</small><b>Carlos · Español</b></div><span style="color:var(--apricot-light)">${svg('swap',20)}</span><div style="text-align:right"><small>CUSTOMER</small><b>Petra · Slovenščina</b></div></div>
  ${!t.log.length?explain('<b>How it works:</b> Carlos speaks Spanish, Petra speaks Slovenian. Each presses their button and talks; the phone shows the translation in large text and reads it aloud. Grey lines show English for this demo.'):''}
  <div class="convo">${t.log.map(m=>`<div class="bub ${m.who}"><span class="l">${m.who==='w'?'Carlos said · shown to customer':'Customer said · shown to Carlos'}</span><span class="o">${esc(m.o)}</span><span class="big">${esc(m.t)}</span><span class="gl">EN: ${esc(m.en)}</span></div>`).join('')}</div>
  <div class="btns"><button class="btn ${!cTurn&&!wDone?'primary':'line'}" ${wDone||cTurn?'disabled style="opacity:.45"':''} onclick="talk('w')">${svg('mic',16)}Carlos speaks (Spanish)</button><button class="btn ${cTurn?'apricot':'line'}" ${!cTurn?'disabled style="opacity:.45"':''} onclick="talk('c')">${svg('mic',16)}Customer speaks (Slovenian)</button></div>
  ${wDone&&cDone?explain('<b>Prices stay with the owner.</b> The price question went straight to you for approval.'):''}
  <div class="eyebrow" style="margin:6px 0 0">Quick phrases · work offline</div><div class="phr">${PHR.map((p,i)=>`<button onclick="speak(PHR[${i}][1],'sl-SI');toast('Shown to customer: ${esc(p[1]).replace(/'/g,"\\'")}')">${svg('speaker',16)}<span>${esc(p[0])}</span></button>`).join('')}</div></div></div>`)}
function talk(w){const t=S.talk;if(w==='w'&&t.wi<TALK_W.length){const m=TALK_W[t.wi++];t.log.push({who:'w',...m});speak(m.t,'sl-SI')}else if(w==='c'&&t.ci<TALK_C.length){const m=TALK_C[t.ci++];t.log.push({who:'c',...m});speak(m.t,'es-ES')}
 drawTalk();if(t.wi>=TALK_W.length&&t.ci>=TALK_C.length)setTimeout(()=>toast('Janez got a question: price for a new valve?'),1300)}
function openBrief(){layer(`<div class="scrim center" onclick="if(event.target===this)closeLayer()"><div class="modal" role="dialog" aria-label="Briefing">
  <div class="mh"><h2>Briefing for Carlos · Boiler service 10:30</h2><button class="x" onclick="closeLayer()" aria-label="Close">${svg('x')}</button></div>
  ${explain('You write in English. <b>Carlos reads and hears it in Spanish.</b> His voice notes come back translated for you.')}
  <div class="grid g2"><div class="card cb"><div class="eyebrow">What you wrote · English</div><p style="margin:0;font-size:15px">${esc(BRIEF.en)}</p></div><div class="card cb"><div class="eyebrow">What Carlos sees · Español</div><p style="margin:0;font-size:15px">${esc(BRIEF.es)}</p><button class="btn line sm" style="margin-top:10px" onclick="speak(BRIEF.es,'es-ES')">${svg('speaker',14)}Listen in Spanish</button></div></div>
  <div class="card cb row"><span class="ic green">${svg('mic')}</span><div style="flex:1"><b>Voice note from Carlos · 0:09</b><div class="muted">“La tubería está corroída, hay que cambiar 2 metros.”</div><div><b style="color:var(--green)">Translated:</b> The pipe is corroded, 2 metres need replacing.</div></div><button class="btn soft sm" onclick="toast('Added to job notes and the invoice draft.')">Add to job</button></div></div></div>`)}

/* ---------- Customers ---------- */
function pCustomers(){
 const map={};S.jobs.forEach(j=>{const m=map[j.name]||(map[j.name]={name:j.name,address:j.address,jobs:0,last:'',spent:0,due:0});m.jobs++;m.last=j.what;if(j.status>=5)m.spent+=Math.round(j.price*1.22)});
 S.invoices.forEach(i=>{const m=map[i.name]||(map[i.name]={name:i.name,address:'Ljubljana',jobs:1,last:i.what,spent:0,due:0});if(i.status==='unpaid')m.due+=i.amount;else m.spent+=0});
 S.calls.forEach(c=>{if(!map[c.name])map[c.name]={name:c.name,address:c.address.split(',')[0],jobs:0,last:c.need,spent:0,due:0,lead:true}});
 const rows=Object.values(map).sort((a,b)=>(b.lead?1:0)-(a.lead?1:0)||b.due-a.due).slice(0,18);
 const care=new Set(['Petra Zupan','Maja Kralj','Luka Debeljak','Robert Zupančič','Tina Košir','Mojca Kolar']);
 let h=head('Customers',`${Object.keys(map).length} customers`,'Every customer, property, call, job and invoice in one history.',`<button class="btn primary" onclick="toast('New customer form')">${svg('plus',16)}New customer</button>`);
 h+=`<div class="card"><div class="tscroll"><table class="tbl"><thead><tr><th>Customer</th><th>Address</th><th>Last request</th><th>Plan</th><th class="num">Jobs</th><th class="num">Balance due</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.lead?' <span class="pill green">New lead</span>':''}</td><td class="muted">${esc(r.address)}</td><td>${esc(r.last)}</td><td>${care.has(r.name)?'<span class="pill ok">Care plan</span>':'<span class="muted">—</span>'}</td><td class="num">${r.jobs}</td><td class="num">${r.due?`<b style="color:var(--apricot-ink)">${eur(r.due)}</b>`:'<span class="muted">€0</span>'}</td><td class="num"><button class="btn line sm" onclick="toast('Opening ${esc(r.name)}: calls, jobs, invoices, property and equipment.')">Open</button></td></tr>`).join('')}</tbody></table></div></div>`;
 h+=`<div style="margin-top:16px">${explain('<b>Built around the property.</b> Each customer keeps their address, equipment (boiler, heat pump) and full service history. This is what later connects to <b>Unbusyness Home</b>.')}</div>`;
 return h;
}

/* ---------- Quotes & invoices ---------- */
function qTotal(d){const net=d.lines.reduce((a,l)=>a+l[1]*l[3],0);return {net,vat:net*0.22,gross:net*1.22}}
function iTotal(i){const net=i.lines.reduce((a,l)=>a+l[1]*l[3],0);return {net,vat:i.amount-net,gross:i.amount}}
function pDocs(){
 if(S.doc) return docView();
 const tab=S.docTab;
 let h=head('Quotes & Invoices','Documents','AI drafts them from calls and finished jobs. You check, approve and send.',`<div class="btns"><button class="btn line" onclick="toast('New work order')">${svg('plus',16)}Work order</button><button class="btn line" onclick="newQuote('c2')">${svg('plus',16)}Quote</button><button class="btn primary" onclick="toast('Pick a finished job to invoice, or start blank.')">${svg('plus',16)}Invoice</button></div>`);
 const unp=S.invoices.filter(i=>i.status==='unpaid'),od=unp.filter(i=>i.overdue);
 h+=`<div class="grid g4" style="margin-bottom:16px">${stat('Waiting to be paid',eur(unpaidSum()),`${unp.length} invoices`,'clock','apricot')}${stat('Overdue',eur(od.reduce((a,i)=>a+i.amount,0)),`${od.length} invoices past due date`,'alert','red')}${stat('Paid this week',eur(paidSum()),`${S.invoices.filter(i=>i.status==='paid').length} invoices`,'check')}${stat('Quotes open',S.quotes.filter(q=>q.status!=='accepted').length,eur(S.quotes.reduce((a,q)=>a+qTotal(q).gross,0))+' total','doc','slate')}</div>`;
 h+=`<div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap"><div class="tabs" role="tablist">${[['invoices','Invoices · '+S.invoices.length],['quotes','Quotes · '+S.quotes.length],['received','Received invoices · '+S.received.length+(S.received.some(r=>r.status!=='ok')?' ⚠':'')],['orders','Work orders']].map(t=>`<button role="tab" aria-selected="${tab===t[0]}" class="${tab===t[0]?'on':''}" onclick="S.docTab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${tab==='invoices'?`<button class="btn soft" onclick="toast('${od.length} friendly reminders sent.')">${svg('send',16)}Remind all overdue (${od.length})</button>`:''}</div>`;
 if(tab==='invoices') h+=`<div class="card"><div class="tscroll"><table class="tbl"><thead><tr><th>Number</th><th>Customer</th><th>Work</th><th>Issued</th><th>Due</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${S.invoices.map(i=>`<tr class="click" onclick="openDoc('invoice','${i.id}')"><td><b>${i.no}</b></td><td>${esc(i.name)}</td><td class="muted">${esc(i.what)}</td><td>${i.issued}</td><td>${i.due}</td><td>${i.status==='paid'?'<span class="pill ok">Paid</span>':i.overdue?`<span class="pill red">Overdue ${i.daysLate} d</span>`:i.viewed?'<span class="pill slate">Viewed</span>':'<span class="pill apricot">Sent</span>'}</td><td class="num"><b>${eur2(i.amount)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
 else if(tab==='quotes') h+=`<div class="card"><div class="tscroll"><table class="tbl"><thead><tr><th>Number</th><th>Customer</th><th>Work</th><th>Date</th><th>Valid until</th><th>Status</th><th class="num">Amount</th></tr></thead><tbody>${S.quotes.map(q=>`<tr class="click" onclick="openDoc('quote','${q.id}')"><td><b>${q.no}</b></td><td>${esc(q.name)}</td><td class="muted">${esc(q.what)}</td><td>${q.date}</td><td>${q.valid}</td><td>${q.status==='draft'?'<span class="pill apricot">Draft by AI</span>':q.status==='sent'?'<span class="pill slate">Sent</span>':'<span class="pill ok">Accepted</span>'}</td><td class="num"><b>${eur2(qTotal(q).gross)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
 else if(tab==='received'){const flag=S.received.filter(r=>r.status!=='ok');
  h+=(flag.length?`<div class="flagbox" style="margin-bottom:12px"><span class="ei">!</span><div><b>${flag.length} need${flag.length===1?'s':''} a look.</b> The AI flags photos that are not invoices, blurry totals and duplicates before anything reaches your expenses.</div></div>`:'')+`<div class="card"><div class="tscroll"><table class="tbl"><thead><tr><th>Supplier</th><th>Invoice no.</th><th>Date</th><th>Cost belongs to</th><th>Uploaded by</th><th>AI check</th><th class="num">Total</th></tr></thead><tbody>${S.received.map(r=>`<tr class="click" onclick="openReceived('${r.id}')"><td><b>${esc(r.supplier)}</b><div class="muted" style="font-size:12px">${esc(r.items)}</div></td><td>${esc(r.no)}</td><td>${esc(r.date)}</td><td class="muted">${esc(rJob(r))}</td><td>${esc(r.by)}</td><td>${rStatus(r)}</td><td class="num"><b>${r.total?eur2(r.total):'—'}</b></td></tr>`).join('')}</tbody></table></div></div>`}
 else h+=`<div class="card cb">${explain('<b>Work orders</b> are created from jobs automatically: task list, materials, photos and the customer signature on the phone. They turn into the invoice in one click.')}</div>`;
 h+=`<div style="margin-top:16px">${explain('<b>Professional documents in one click.</b> Your logo, company and VAT details, numbered automatically, VAT calculated, with a payment link and QR code. They sync to QuickBooks, Xero or Zoho Books, or stay in Unbusyness’s basic accounting.')}</div>`;
 return h;
}

  <div class="bill"><div><small>${isQ?'Prepared for':'Bill to'}</small><b>${esc(d.name)}</b><div>${esc(addr)}</div></div><div><small>Job</small><div>${esc(d.what)}</div><div>${isQ?'Written from your call on 21 Oct 2026':'Work completed by Demo Plumbing Co.'}</div></div></div>

/* ---------- voice commands ---------- */
const VOICE=[{say:'Pipe repair at Toplarniška 7 next Tuesday at 16:00, work order 150 euros plus VAT.',plan:[['Create job','Pipe repair'],['Where','Toplarniška ulica 7'],['When','Next Tuesday, 16:00'],['Work order','€150 + VAT']],done:'job'},{say:'Remind Luka to pay the radiator invoice.',plan:[['Send reminder','Luka Perko'],['Invoice','Radiator valve · €140']],done:'remind'},{say:'Invoice Bojan for the drain cleaning.',plan:[['Create invoice','Bojan Sušnik'],['Work','Drain cleaning'],['Amount','€110 + VAT = €134.20']],done:'inv'}];
let vs=null,vt=null;
function openVoice(idx){clearInterval(vt);hush();
 if(idx===undefined){vs={phase:'pick'};drawVoice();return}
 const v=VOICE[idx];vs={v,phase:'listen',shown:'',assign:'carlos'};drawVoice();let i=0;const w=v.say.split(' ');
 vt=setInterval(()=>{vs.shown=w.slice(0,++i).join(' ');drawVoice();if(i>=w.length){clearInterval(vt);setTimeout(()=>{if(!vs)return;vs.phase='plan';drawVoice();speak('Got it. Please check and confirm.','en-US')},400)}},150)}
function drawVoice(){const box=document.querySelector('#layer .voice');const inner=`<div class="mh"><b>Voice command</b><button class="x" style="background:rgba(255,255,255,.14);border:0;color:var(--linen)" onclick="closeVoice()" aria-label="Close">${svg('x')}</button></div>
 <div class="orb ${vs.phase==='listen'?'live':''}">${svg(vs.phase==='plan'?'check':'mic',40)}</div>
 ${vs.phase==='pick'?`<div style="text-align:center;color:var(--on-green)">Say what needs to happen. Try one:</div><div class="ex">${VOICE.map((x,i)=>`<button onclick="openVoice(${i})">“${esc(x.say)}”</button>`).join('')}</div>`:`<div style="text-align:center;color:var(--on-green)">${vs.phase==='listen'?'Listening…':'Got it. Check and confirm.'}</div><div class="said">“${esc(vs.shown)}”</div>`}
 ${vs.phase==='plan'?`<div class="plan">${vs.v.plan.map(p=>`<div class="pr"><span class="muted">${p[0]}</span><b>${esc(p[1])}</b></div>`).join('')}${vs.v.done==='job'?`<div style="padding-top:8px"><span class="muted" style="font-size:13px">Who does it?</span><div class="who">${whoButtons(vs.assign,'pickAssign(K)')}</div><div class="muted" style="font-size:12px;margin-top:6px">${vs.assign==='carlos'?'Suggested: Carlos is free on Tuesday afternoon.':vs.assign==='me'?'You keep the job.':CREW[vs.assign].name+' gets it in '+CREW[vs.assign].lang+'.'}</div></div>`:''}<div class="btns" style="margin-top:10px"><button class="btn line" onclick="openVoice()">Try again</button><button class="btn primary" onclick="confirmVoice()">${svg('check',16)}Confirm</button></div></div>`:''}`;
 if(box)box.innerHTML=inner;else layer(`<div class="scrim center" onclick="if(event.target===this)closeVoice()"><div class="voice" role="dialog" aria-label="Voice command">${inner}</div></div>`)}
function pickAssign(k){if(vs){vs.assign=k;drawVoice()}}
function closeVoice(){clearInterval(vt);hush();vs=null;closeLayer()}
